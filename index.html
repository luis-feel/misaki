    // ============================================================

    const WORD_NUMS = {
      "cero":0,"uno":1,"una":1,"un":1,"dos":2,"tres":3,"cuatro":4,"cinco":5,
      "seis":6,"siete":7,"ocho":8,"nueve":9,"diez":10,"once":11,"doce":12,
      "trece":13,"catorce":14,"quince":15,"veinte":20,"treinta":30,"cuarenta":40,
      "cincuenta":50,"sesenta":60,"setenta":70,"ochenta":80,"noventa":90,"cien":100,"mil":1000
    };

    function wordsToNumber(token){
      token = (token||"").toLowerCase().trim();
      if(/^\d+$/.test(token)) return parseInt(token,10);
      if(WORD_NUMS[token]!==undefined) return WORD_NUMS[token];
      return null;
    }

    function parseDistribucionVoz(text, totalPiezas = 0){
      const normal = text.toLowerCase()
        .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u")
        .replace(/\by\b/g," ");

      const resultado = { M:{paquetes:0,piezas:0}, C:{paquetes:0,piezas:0}, R:{paquetes:0,piezas:0} };
      let encontrado = false;

      // "todo para Misaki" / "todo a M"
      const todoMatch = normal.match(/todo\s+(?:para|a)\s+(\w+)/);
      if(todoMatch){
        const u = ALIAS_UBICACION[todoMatch[1]] || todoMatch[1].toUpperCase();
        if(UBICACIONES.includes(u)){
          resultado[u].piezas = totalPiezas;
          return {ok:true, distribucion:resultado, nota:"Todo a "+u};
        }
      }

      // "uno a cada uno" / "una caja a cada lugar"
      const cada = normal.match(/([\w]+)\s+(?:paquetes?|cajas?|piezas?)?\s*(?:a\s+)?cada\s+(?:uno|lugar)/);
      if(cada){
        const n = wordsToNumber(cada[1]) || 1;
        UBICACIONES.forEach(u => resultado[u].paquetes = n);
        return {ok:true, distribucion:resultado, nota:"Igual a cada uno"};
      }

      // Patrones por ubicación
      for(const [alias, ubic] of Object.entries(ALIAS_UBICACION)){
        const re = new RegExp(`(\\d+|[\\w]+)\\s*(?:paquetes?|cajas?|piezas?)?\\s*(?:para|a|en)?\\s*${alias}`, "i");
        const m = normal.match(re);
        if(m){
          const n = wordsToNumber(m[1]) ?? parseInt(m[1]) ?? 0;
          if(normal.includes("pieza")) resultado[ubic].piezas = n;
          else resultado[ubic].paquetes = n;
          encontrado = true;
        }
      }

      // "el resto a C y R"
      if(normal.includes("resto") || normal.includes("demás") || normal.includes("restante")){
        const asignado = Object.values(resultado).reduce((s,v)=>s + (v.paquetes||0) + (v.piezas||0), 0);
        // Lógica simple de resto (se puede mejorar)
        encontrado = true;
      }

      return encontrado ? {ok:true, distribucion:resultado} : {ok:false};
    }

    // ============================================================
    // IMAGEN
    // ============================================================
    async function procesarImagen(file){
      return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = 96; canvas.height = 96;
            const ctx = canvas.getContext("2d");
            const ratio = Math.max(96/img.width, 96/img.height);
            const w = img.width*ratio, h = img.height*ratio;
            ctx.drawImage(img, (96-w)/2, (96-h)/2, w, h);
            canvas.toBlob(b => resolve(b), "image/webp", 0.7);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function subirImagen(blob, folder="productos"){
      if(!supabase || !state.online) return null;
      const path = `${folder}/${uid()}.webp`;
      const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, blob, { contentType:"image/webp", upsert:false });
      if(error) throw error;
      const { data: pub } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path);
      return pub.publicUrl;
    }

    async function login(codigo, pin){

      if(supabase && state.online){
        const { data, error } = await supabase.from("usuarios").select("*").eq("id",codigo).eq("pin",pin).maybeSingle();

      }
      const local = await db.usuarios.get(codigo);
      if(local && local.pin===pin) return local;
      return null;
    }

    // ============================================================
    // SINCRONIZACIÓN
    // ============================================================
    async function sincronizar(silencioso=false){
      if(!supabase || !state.online){
        if(!silencioso) toast(state.online ? "Supabase no configurado" : "Sin conexión","warn");
        return;
      }
      try{
        const tables = ["productos","compras","envios","inventario_sucursal","mermas","usuarios"];
        for(const t of tables){
          const all = await db[t].toArray();
          const pend = all.filter(r => r.synced===false || r.synced===0);
          for(const r of pend){
            const { synced, ...row } = r;
            try{
              await supabase.from(t).upsert(row);
              await db[t].put({...r, synced:true});
            }catch(e){ console.warn("sync fail", t, e); }
          }
        }
        // Bajar datos remotos
        for(const t of ["productos","compras","envios","inventario_sucursal","mermas","usuarios"]){
          const { data } = await supabase.from(t).select("*");
          if(data) await db[t].bulkPut(data.map(r => ({...r, synced:true})));
        }
        state.lastSync = new Date().toISOString();
        state.pendingSync = false;
        if(!silencioso) toast("Sincronizado","ok");
        render();
      }catch(e){
        console.error(e);
        if(!silencioso) toast("Error al sincronizar","err");
      }
    }

            if(porNombre.length) producto = porNombre[0];
          }

          if(!producto){
            producto = {
              id: uid(),
              codigo: codigo || ("AUTO-"+Date.now().toString().slice(-6)),
              nombre,
              estado: "activo",
              stock_total_bodega: total,
              creado_en: new Date().toISOString(),
              synced: false
            };
            await db.productos.put(producto);
          } else {
            // Reutilizar producto y agregar código alterno si es diferente
            if(codigo && codigo !== producto.codigo){
              const sinonimos = producto.sinonimos || [];
              if(!sinonimos.includes(codigo)) sinonimos.push(codigo);
              producto.sinonimos = sinonimos;
            }
            producto.stock_total_bodega = (producto.stock_total_bodega||0) + total;
            producto.synced = false;
            await db.productos.put(producto);
          }

          let fUrl = null;
          if(fotoBlob){
            try{ fUrl = await subirImagen(fotoBlob); }catch(e){ console.warn(e); }
          }

          const compra = {
            id: uid(),
            producto_id: producto.id,
            codigo: producto.codigo,
            nombre: producto.nombre,
            proveedor: $("#c-proveedor").value.trim(),
            nota: $("#c-nota").value.trim(),
            fecha: new Date().toISOString().slice(0,10),
            foto_url: fUrl,
            cajas: Number($("#c-cajas").value)||0,
            paquetes_por_caja: Number($("#c-paq-caja").value)||0,
            paquetes: Number($("#c-paquetes").value)||0,
            piezas_por_paquete: Number($("#c-ppp").value)||0,
            piezas_sueltas: Number($("#c-sueltas").value)||0,
            total_piezas: total,
            creado_en: new Date().toISOString(),
            creado_por: state.user.id,
            synced: false
          };
          await db.compras.put(compra);
          programarSync();
          toast("Compra registrada","ok");
          render();
        };

        // Cargar lista
        const compras = await db.compras.orderBy("fecha").reverse().limit(20).toArray();
        list.innerHTML = compras.length ? compras.map(c => `
          <div class="bg-white rounded-xl p-3 shadow-sm flex gap-3">
            ${c.foto_url ? `<img src="${c.foto_url}" class="w-12 h-12 rounded-lg object-cover" />` : `<div class="w-12 h-12 rounded-lg bg-slate-100 flex items-center justify-center">📦</div>`}
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-sm truncate">${escapeHtml(c.nombre)}</p>
              <p class="text-xs text-slate-500">${c.total_piezas} pz · ${c.proveedor||"Sin proveedor"} · ${c.fecha}</p>
            </div>
          </div>
        `).join("") : `<p class="text-sm text-slate-400 text-center py-4">Sin compras aún</p>`;
      },0);

      return wrap;
    }

    // ============================================================
    // ADMIN - DISTRIBUIR (pendientes)
    // ============================================================
    function renderDistribuir(){
      const wrap = el("div",{class:"space-y-4 fade-in"});
      wrap.appendChild(el("h2",{class:"text-xl font-bold"},"Pendiente de distribuir"));
      const list = el("div",{id:"dist-list",class:"space-y-2"});
      wrap.appendChild(list);

      setTimeout(async ()=>{
        // Por simplicidad mostramos productos con stock
        const prods = await db.productos.toArray();
        const conStock = prods.filter(p => (p.stock_total_bodega||0) > 0);
        list.innerHTML = conStock.length ? conStock.map(p => `
          <div class="bg-white rounded-xl p-3 shadow-sm">
            <p class="font-semibold">${escapeHtml(p.nombre)}</p>
            <p class="text-xs text-slate-500">Stock disponible: ${p.stock_total_bodega||0} piezas</p>
            <button data-id="${p.id}" class="mt-2 text-sm text-brand-600 font-semibold btn-dist">Distribuir →</button>
          </div>
        `).join("") : `<p class="text-sm text-slate-400 text-center py-6">No hay stock pendiente de distribuir</p>`;

        list.querySelectorAll(".btn-dist").forEach(btn => {
          btn.onclick = () => {
            toast("Módulo de distribución detallada en siguiente iteración","warn");
            // Aquí se abriría el formulario de distribución M/C/R
          };
        });
      },0);
      return wrap;
    }

    // ============================================================
    // ADMIN - REPORTES
    // ============================================================
    function renderReportes(){
      const wrap = el("div",{class:"space-y-4 fade-in"});
      wrap.appendChild(el("h2",{class:"text-xl font-bold"},"Reportes"));
      
      const tabs = el("div",{class:"flex gap-2 overflow-x-auto no-scrollbar"});
      ["compra","traslado","diferencias"].forEach(t => {
        const btn = el("button",{
          class:"px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap "+(state.rtab===t?"bg-brand-600 text-white":"bg-white text-slate-600 shadow-sm"),
          onclick:()=>{state.rtab=t; render();}
        }, t==="compra"?"COMPRA":t==="traslado"?"TRASLADO":"DIFERENCIAS");
        tabs.appendChild(btn);
      });
      wrap.appendChild(tabs);

      const body = el("div",{class:"mt-3 text-sm text-slate-600"});
      body.innerHTML = `<p class="text-center py-8">Selecciona un tipo de reporte.<br>Los reportes detallados se completarán en la siguiente versión.</p>`;
      wrap.appendChild(body);
      return wrap;
    }

    // ============================================================
    // ADMIN - CONFIG
    // ============================================================
    function renderConfig(){
      const wrap = el("div",{class:"space-y-4 fade-in"});
      wrap.appendChild(el("h2",{class:"text-xl font-bold"},"Configuración"));
      wrap.appendChild(el("p",{class:"text-sm text-slate-500"},"Gestión de usuarios y ajustes."));
      return wrap;
    }

    // ============================================================
    // SUCURSAL - RECIBIR (una sola firma)
    // ============================================================
    function renderRecibir(){
      const wrap = el("div",{class:"space-y-3 fade-in"});
      wrap.appendChild(el("h2",{class:"text-xl font-bold"},"Recibir envíos"));
      
      const firmaBox = el("div",{class:"bg-brand-50 rounded-2xl p-3 flex gap-2 items-center"});
      firmaBox.innerHTML = `
        <input id="firma-lote" placeholder="Nombre de quien recibe" class="flex-1 px-3 py-2 rounded-xl border font-semibold uppercase outline-none" />
        <button id="confirmar-lote" class="bg-brand-600 text-white px-4 py-2 rounded-xl font-semibold text-sm whitespace-nowrap">Confirmar todo</button>
      `;
      wrap.appendChild(firmaBox);

      const list = el("div",{id:"rec-list",class:"space-y-2 mt-3"});
      wrap.appendChild(list);

      setTimeout(async ()=>{
        const ubicacion = state.user.id.charAt(0); // M, C o R
        const envios = await db.envios.where("estado").equals("ENVIADO").toArray();
        const mios = envios.filter(e => e.sucursal_destino === ubicacion || e.sucursal_destino === state.user.id);

        list.innerHTML = mios.length ? mios.map(e => `
          <div class="bg-white rounded-xl p-3 shadow-sm border-l-4 border-brand-500">
            <p class="font-semibold text-sm">${escapeHtml(e.nombre || "Producto")}</p>
            <p class="text-xs text-slate-500">Enviado: ${e.total_enviado_piezas||e.cantidad_enviada||0} piezas</p>
            <div class="grid grid-cols-2 gap-2 mt-2">
              <input type="number" placeholder="Pz recibidas" class="border rounded-lg px-2 py-1 text-center text-sm" data-id="${e.id}" />
              <select class="border rounded-lg px-2 py-1 text-sm" data-id="${e.id}">
                <option value="ok">Correcto</option>
                <option value="dif">Con diferencia</option>
              </select>
            </div>
          </div>
        `).join("") : `<p class="text-sm text-slate-400 text-center py-8">No hay envíos pendientes</p>`;

        $("#confirmar-lote").onclick = async () => {
          const nombre = $("#firma-lote").value.trim().toUpperCase();
          if(!nombre){ toast("Escribe quién recibe","err"); return; }
          toast("Recepción confirmada con firma: "+nombre,"ok");
          // Aquí se procesarían todos los ítems del lote con una sola firma
          render();
        };
      },0);
      return wrap;
    }

    // ============================================================
    // SUCURSAL - CONSULTAR
    // ============================================================
    function renderConsultar(){
      const wrap = el("div",{class:"space-y-3 fade-in"});
      wrap.appendChild(el("h2",{class:"text-xl font-bold"},"Consultar"));
      wrap.appendChild(el("input",{type:"text", placeholder:"🔍 Buscar por nombre o código...", class:"w-full px-4 py-3 rounded-xl border outline-none"}));
      wrap.appendChild(el("p",{class:"text-sm text-slate-400 text-center py-8"},"Catálogo de productos y precios"));
      return wrap;
    }

    // ============================================================
    // SUCURSAL - MERMAS
    // ============================================================
    function renderMermasSucursal(){
      const wrap = el("div",{class:"space-y-3 fade-in"});
      wrap.appendChild(el("h2",{class:"text-xl font-bold"},"Reportar Merma"));
      wrap.appendChild(el("p",{class:"text-sm text-slate-500"},"Puedes reportar merma en cualquier momento (dañado, roto, mojado, etc.)"));
      return wrap;
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init(){
      await seedUsuariosLocal();
      window.addEventListener("online", ()=>{ state.online=true; render(); });
      window.addEventListener("offline",()=>{ state.online=false; render(); });
      state.online = navigator.onLine;
      render();
    }
    init();
  </script>
</body>
</html>
