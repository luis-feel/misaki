    // ============================================================
    // PARSER DE VOZ (cantidades + distribución)
    // ============================================================
    const WORD_NUMS = {
      cero:0,uno:1,una:1,un:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,
      once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,
      sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,mil:1000
    };
    function wordsToNumber(t){
      t = (t||"").toLowerCase().trim();
      if(/^\d+$/.test(t)) return parseInt(t,10);
      return WORD_NUMS[t] ?? null;
    }

    function parseCantidades(text){
      const norm = text.toLowerCase().replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u");
      const nums = [];
      norm.split(/[\s,;.]+/).forEach(tk=>{
        const n = wordsToNumber(tk);
        if(n!==null) nums.push(n);
      });

      let paquetes=0, ppp=0, sueltas=0;

      // Patrones comunes
      const m1 = norm.match(/(\d+|\w+)\s*(?:paquetes?|cajas?|bolsas?)\s*(?:de|con)?\s*(\d+|\w+)\s*piezas?/);
      const m2 = norm.match(/(\d+|\w+)\s*piezas?\s*por\s*paquete/);
      const m3 = norm.match(/(\d+|\w+)\s*piezas?\s*sueltas?/);

      if(m1){
        paquetes = wordsToNumber(m1[1])||0;
        ppp = wordsToNumber(m1[2])||0;
      }
      if(nums.length===1){ sueltas = nums[0]; }
      else if(nums.length===2){ paquetes=nums[0]; ppp=nums[1]; }
      else if(nums.length>=3){ paquetes=nums[0]; ppp=nums[1]; sueltas=nums[2]; }

      // Convertir cajas a paquetes si se detecta
      const cajas = norm.match(/(\d+|\w+)\s*cajas?\s*(?:con|de)?\s*(\d+|\w+)\s*(?:paquetes?|bolsas?)/);
      if(cajas){
        const nc = wordsToNumber(cajas[1])||0;
        const np = wordsToNumber(cajas[2])||0;
        paquetes = nc * np;
      }

      const total = paquetes * ppp + sueltas;
      return {ok: total>0, paquetes, ppp, sueltas, total, raw:text};
    }

    function parseDistribucion(text, totalPiezas=0){
      const norm = text.toLowerCase()
        .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u")
        .replace(/\by\b/g," ");

      const res = {M:{paquetes:0,piezas:0}, C:{paquetes:0,piezas:0}, R:{paquetes:0,piezas:0}};
      let found = false;

      // Todo para X
      const todo = norm.match(/todo\s+(?:para|a)\s+(\w+)/);
      if(todo){
        const u = ALIAS[todo[1]] || todo[1].toUpperCase();
        if(UBICACIONES.includes(u)){
          res[u].piezas = totalPiezas;
          return {ok:true, distribucion:res};
        }
      }

      // 1 a cada uno / uno a cada quien
      if(/cada\s+(uno|quien|lugar)/.test(norm)){
        const n = wordsToNumber(norm.match(/(\d+|\w+)\s*(?:a\s+)?cada/)?.[1]) || 1;
        UBICACIONES.forEach(u => res[u].paquetes = n);
        return {ok:true, distribucion:res};
      }

      // Patrones por ubicación
      for(const [alias, ubic] of Object.entries(ALIAS)){
        const re = new RegExp(`(\\d+|\\w+)\\s*(?:paquetes?|piezas?)?\\s*(?:para|a|en)?\\s*${alias}`,"i");
        const m = norm.match(re);
        if(m){
          const n = wordsToNumber(m[1]) ?? parseInt(m[1]) ?? 0;
          if(norm.includes("pieza")) res[ubic].piezas += n;
          else res[ubic].paquetes += n;
          found = true;
        }
      }

      // Formato corto: "2m 1c 1r" o "1,1,1"
      const corto = norm.match(/(\d+)\s*m\s*(\d+)\s*c\s*(\d+)\s*r/i) || norm.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if(corto){
        res.M.paquetes = parseInt(corto[1])||0;
        res.C.paquetes = parseInt(corto[2])||0;
        res.R.paquetes = parseInt(corto[3])||0;
        found = true;
      }

      return found ? {ok:true, distribucion:res} : {ok:false};
    }

    async function procesarImagen(file){
      return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas");
            c.width=96; c.height=96;
            const ctx = c.getContext("2d");
            const r = Math.max(96/img.width,96/img.height);
            ctx.drawImage(img,(96-img.width*r)/2,(96-img.height*r)/2,img.width*r,img.height*r);
            c.toBlob(b=>resolve(b),"image/webp",0.7);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    async function subirImagen(blob){
      if(!supabase||!state.online) return null;
      const path = `productos/${uid()}.webp`;
      const {error} = await supabase.storage.from(STORAGE_BUCKET).upload(path,blob,{contentType:"image/webp"});
      if(error) throw error;
      return supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    // ============================================================

    async function login(codigo, pin){
      codigo = codigo.trim().toUpperCase();
      if(supabase && state.online){
        const {data} = await supabase.from("usuarios").select("*").eq("id",codigo).eq("pin",pin).maybeSingle();
        if(data){ await db.usuarios.put({...data,synced:true}); return data; }
      }
      const local = await db.usuarios.get(codigo);
      return (local && local.pin===pin) ? local : null;
    }

    async function sincronizar(){
      if(!supabase||!state.online){ toast("Sin conexión","warn"); return; }
      try{
        for(const t of ["productos","compras","envios","usuarios"]){
          const pend = (await db[t].toArray()).filter(r=>!r.synced);
          for(const r of pend){
            const {synced,...row}=r;
            await supabase.from(t).upsert(row);
            await db[t].put({...r,synced:true});
          }
        }
        state.lastSync = new Date().toISOString();
        toast("Sincronizado","ok");
        render();
      }catch(e){ toast("Error sync","err"); }
    }

            R:{paquetes:+$("#d-R-paq").value||0, piezas:+$("#d-R-pzs").value||0}
          };
          const distTotal = UBICACIONES.reduce((s,u)=>s + dist[u].paquetes*ppp + dist[u].piezas, 0);
          const val = $("#d-validacion");
          if(distTotal > total) { val.textContent="Distribución supera el total"; val.className="mt-2 text-sm font-medium text-red-600"; }
          else if(distTotal===total && total>0){ val.textContent="Distribución completa"; val.className="mt-2 text-sm font-medium text-emerald-600"; }
          else { val.textContent="Falta distribuir"; val.className="mt-2 text-sm font-medium text-amber-600"; }
          return {total, dist, ppp};
        };
        ["#p-paquetes","#p-ppp","#p-sueltas","#d-M-paq","#d-M-pzs","#d-C-paq","#d-C-pzs","#d-R-paq","#d-R-pzs"]
          .forEach(s=>$(s)?.addEventListener("input",calc));

        // Foto
        $("#foto-input").onchange = async e=>{
          const f = e.target.files[0]; if(!f) return;
          fotoBlob = await procesarImagen(f);
          $("#foto-preview").innerHTML = `<img src="${URL.createObjectURL(fotoBlob)}" class="w-16 h-16 rounded-xl object-cover">`;
        };

        // Dictado cantidades
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        $("#btn-dictar-cant").onclick = ()=>{
          if(!SR){ toast("Sin soporte de voz","err"); return; }
          const r = new SR(); r.lang="es-MX";
          $("#dictar-cant-status").classList.remove("hidden");
          r.onresult = e=>{
            const texto = e.results[0][0].transcript;
            const res = parseCantidades(texto);
            $("#dictar-cant-status").classList.add("hidden");
            if(res.ok){
              $("#p-paquetes").value = res.paquetes;
              $("#p-ppp").value = res.ppp;
              $("#p-sueltas").value = res.sueltas;
              calc();
              toast("Cantidades: "+res.total+" pz");
            } else toast("No entendí: "+texto,"warn");
          };
          r.onerror = ()=>{$("#dictar-cant-status").classList.add("hidden"); toast("Error de voz","err");};
          r.start();
        };

        // Dictado distribución
        $("#btn-dictar-dist").onclick = ()=>{
          if(!SR){ toast("Sin soporte de voz","err"); return; }
          const r = new SR(); r.lang="es-MX";
          $("#dictar-dist-status").classList.remove("hidden");
          r.onresult = e=>{
            const texto = e.results[0][0].transcript;
            const {total, ppp} = calc();
            const res = parseDistribucion(texto, total);
            $("#dictar-dist-status").classList.add("hidden");
            if(res.ok){
              UBICACIONES.forEach(u=>{
                $(`#d-${u}-paq`).value = res.distribucion[u].paquetes;
                $(`#d-${u}-pzs`).value = res.distribucion[u].piezas;
              });
              calc();
              toast("Distribución aplicada");
            } else toast("No entendí distribución: "+texto,"warn");
          };
          r.onerror = ()=>{$("#dictar-dist-status").classList.add("hidden");};
          r.start();
        };

        // Guardar Producto
        $("#btn-guardar").onclick = async ()=>{
          const codigo = $("#p-codigo").value.trim().toUpperCase();
          const nombre = $("#p-nombre").value.trim();
          if(!nombre){ toast("Nombre obligatorio","err"); return; }
          const {total, dist, ppp} = calc();
          if(total<=0){ toast("Indica cantidades","err"); return; }

          // Anti-duplicado
          let prod = null;
          if(codigo){
            const found = await db.productos.where("codigo").equals(codigo).first();
            if(found) prod = found;
          }
          if(!prod){
            const found = await db.productos.filter(p=>p.nombre.toLowerCase()===nombre.toLowerCase()).first();
            if(found) prod = found;
          }

          if(!prod){
            prod = {
              id: uid(),
              codigo: codigo || ("P"+Date.now().toString().slice(-6)),
              nombre,
              estado: "activo",
              stock_total_bodega: total,
              piezas_por_paquete: ppp,
              precio_base: +$("#p-precio").value||null,
              creado_en: new Date().toISOString(),
              synced: false
            };
          } else {
            prod.stock_total_bodega = (prod.stock_total_bodega||0) + total;
            prod.synced = false;
          }
          await db.productos.put(prod);

          let fUrl = null;
          if(fotoBlob){ try{ fUrl = await subirImagen(fotoBlob);}catch(e){} }

          // Siempre se crea registro de COMPRA (aparece en reporte aunque no se distribuya)
          const compra = {
            id: uid(),
            producto_id: prod.id,
            codigo: prod.codigo,
            nombre: prod.nombre,
            fecha: new Date().toISOString().slice(0,10),
            proveedor: $("#p-nota").value.trim() || null,
            nota: $("#p-nota").value.trim() || null,
            foto_url: fUrl,
            paquetes: +$("#p-paquetes").value||0,
            piezas_por_paquete: ppp,
            piezas_sueltas: +$("#p-sueltas").value||0,
            total_piezas: total,
            creado_en: new Date().toISOString(),
            creado_por: state.user.id,
            synced: false
          };
          await db.compras.put(compra);

          // Si hay distribución, crear envíos
          let hayDist = false;
          for(const u of UBICACIONES){
            const pz = dist[u].paquetes * ppp + dist[u].piezas;
            if(pz>0){
              hayDist = true;
              await db.envios.put({
                id: uid(),
                producto_id: prod.id,
                nombre: prod.nombre,
                sucursal_destino: u,
                cantidad_enviada: pz,
                total_enviado_piezas: pz,
                paquetes_enviados: dist[u].paquetes,
                piezas_sueltas_enviadas: dist[u].piezas,
                estado: "ENVIADO",
                fecha_envio: new Date().toISOString(),
                synced: false
              });
            }
          }

          toast(hayDist ? "Producto guardado y distribuido" : "Producto guardado (pendiente de distribuir)");
          // Limpiar formulario
          ["p-codigo","p-nombre","p-paquetes","p-ppp","p-sueltas","p-precio","p-nota"].forEach(id=>$(`#${id}`).value = id.includes("paq")||id.includes("ppp")||id.includes("suel")?"0":"");
          UBICACIONES.forEach(u=>{ $(`#d-${u}-paq`).value=0; $(`#d-${u}-pzs`).value=0; });
          $("#foto-preview").innerHTML="📷";
          fotoBlob=null;
          calc();
          cargarLista();
        };

        async function cargarLista(){
          const compras = await db.compras.orderBy("creado_en").reverse().limit(15).toArray();
          list.innerHTML = compras.length ? compras.map(c=>`
            <div class="bg-white rounded-xl p-3 shadow-sm flex gap-3 items-center">
              ${c.foto_url?`<img src="${c.foto_url}" class="w-12 h-12 rounded-lg object-cover">`:`<div class="w-12 h-12 rounded-lg bg-brand-50 flex items-center justify-center">📦</div>`}
              <div class="flex-1 min-w-0">
                <p class="font-semibold text-sm truncate">${escapeHtml(c.nombre)}</p>
                <p class="text-xs text-slate-500">${c.total_piezas} pz · ${c.fecha}</p>
              </div>
            </div>
          `).join("") : `<p class="text-sm text-slate-400 text-center py-4">Sin registros</p>`;
        }
        cargarLista();
        calc();
      },0);

      return wrap;
    }

    // ============================================================
    // REPORTES (COMPRA ya funciona)
    // ============================================================
    function renderReportes(){
      const wrap = el("div",{class:"space-y-4 fade-in"});
      wrap.appendChild(el("h2",{class:"text-xl font-bold text-brand-900"},"Reportes"));

      const tabs = el("div",{class:"flex gap-2"});
      ["compra","traslado","diferencias"].forEach(t=>{
        tabs.appendChild(el("button",{
          class:"px-4 py-2 rounded-full text-sm font-medium "+(state.rtab===t?"bg-brand-600 text-white":"bg-white shadow text-slate-600"),
          onclick:()=>{state.rtab=t; render();}
        }, t.toUpperCase()));
      });
      wrap.appendChild(tabs);

      const body = el("div",{id:"rep-body",class:"mt-3 space-y-2"});
      wrap.appendChild(body);

      setTimeout(async ()=>{
        const tab = state.rtab || "compra";
        if(tab==="compra"){
          const compras = await db.compras.orderBy("fecha").reverse().toArray();
          body.innerHTML = compras.length ? compras.map(c=>`
            <div class="bg-white rounded-xl p-3 shadow-sm flex gap-3">
              ${c.foto_url?`<img src="${c.foto_url}" class="w-14 h-14 rounded-lg object-cover">`:`<div class="w-14 h-14 bg-brand-50 rounded-lg flex items-center justify-center">📦</div>`}
              <div class="flex-1">
                <p class="font-bold text-sm">${escapeHtml(c.nombre)}</p>
                <p class="text-xs text-slate-500">${c.total_piezas} piezas · ${c.fecha}</p>
                <p class="text-xs text-slate-400">${c.proveedor||c.nota||""}</p>
              </div>
            </div>
          `).join("") : `<p class="text-center text-slate-400 py-8">No hay compras registradas</p>`;
        } else {
          body.innerHTML = `<p class="text-center text-slate-400 py-8">Reporte ${tab} en construcción</p>`;
        }
      },0);
      return wrap;
    }

    function renderConfig(){
      return el("div",{class:"fade-in"}, el("h2",{class:"text-xl font-bold"},"Configuración"), el("p",{class:"text-sm text-slate-500 mt-2"},"Usuarios y ajustes"));
    }
    function renderRecibir(){
      return el("div",{class:"fade-in"}, el("h2",{class:"text-xl font-bold"},"Recibir"), el("p",{class:"text-sm text-slate-500 mt-2"},"Confirmación de lote con una sola firma"));
    }
    function renderConsultar(){
      return el("div",{class:"fade-in"}, el("h2",{class:"text-xl font-bold"},"Consultar"));
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init(){
      await seedUsuarios();
      window.addEventListener("online",()=>{state.online=true;render();});
      window.addEventListener("offline",()=>{state.online=false;render();});
      render();
    }
    init();
  </script>
</body>
</html>
