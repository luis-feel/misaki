    // ===================== CÁMARA REAL EN VIVO CON VISOR =====================
    async function openCameraDirectly(onPhotoTaken, onFallbackToInput){
      // 1. Intentar usar la API de Cámara Web en Vivo (getUserMedia)
      let currentFacing = "environment";
      if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
        try {
          let stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: currentFacing }, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false
          });
          
          const prev = $("#custom-modal");
          if(prev) prev.remove();
          const camModal = el("div",{id:"custom-modal",class:"fixed inset-0 z-[200] bg-black flex flex-col justify-between"});
          camModal.innerHTML = `
            <div class="p-3 flex justify-between items-center text-white bg-slate-950/80 z-10">
              <span id="cam-title-lbl" class="text-xs font-bold flex items-center gap-1.5"><span>📸</span><span>Cámara Trasera</span></span>
              <div class="flex items-center gap-2">
                <button id="flip-live-cam" class="px-2.5 py-1.5 bg-white/20 hover:bg-white/30 rounded-xl text-xs font-bold flex items-center gap-1">🔄 Voltear</button>
                <button id="close-live-cam" class="px-3 py-1.5 bg-white/20 hover:bg-white/30 rounded-xl text-xs font-bold">✕ Cerrar</button>
              </div>
            </div>
            <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
              <video id="live-cam-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
              <canvas id="live-cam-canvas" class="hidden"></canvas>
            </div>
            <div class="p-4 bg-slate-950/90 flex justify-around items-center z-10">
              <button id="switch-cam-file" class="px-3 py-2 bg-white/20 hover:bg-white/30 text-white rounded-xl text-xs font-semibold">📁 Archivo</button>
              <button id="snap-live-cam" class="w-16 h-16 rounded-full border-4 border-white bg-red-600 active:scale-95 shadow-lg flex items-center justify-center text-2xl transition-all">📸</button>
              <div class="w-16"></div>
            </div>
          `;
          document.body.appendChild(camModal);
          
          const video = camModal.querySelector("#live-cam-video");
          video.srcObject = stream;
          await video.play().catch(()=>{});

          const stopStream = ()=>{
            if(stream) stream.getTracks().forEach(t=>t.stop());
            camModal.remove();
          };

          camModal.querySelector("#close-live-cam").onclick = stopStream;

          camModal.querySelector("#flip-live-cam").onclick = async ()=>{
            currentFacing = currentFacing === "environment" ? "user" : "environment";
            if(stream) stream.getTracks().forEach(t=>t.stop());
            try {
              stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: currentFacing } }, audio: false
              });
              video.srcObject = stream;
              await video.play().catch(()=>{});
              camModal.querySelector("#cam-title-lbl").innerHTML = `<span>📸</span><span>Cámara ${currentFacing==="user"?"Frontal":"Trasera"}</span>`;
            } catch(e){}
          };

          camModal.querySelector("#switch-cam-file").onclick = ()=>{
            stopStream();
            if(onFallbackToInput) onFallbackToInput();
          };

          camModal.querySelector("#snap-live-cam").onclick = ()=>{
            const canvas = camModal.querySelector("#live-cam-canvas");
            const w = video.videoWidth || 640;
            const h = video.videoHeight || 480;
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, w, h);
            canvas.toBlob(async blob=>{
              stopStream();
              if(blob){
                const optBlob = await procesarImagen(blob);
                if(onPhotoTaken) onPhotoTaken(optBlob || blob);
              }
            }, "image/jpeg", 0.85);
          };
          return;
        } catch(err){
          console.warn("getUserMedia no disponible o denegado, recurriendo al selector nativo", err);
        }
      }
      
      // 2. Si no hay getUserMedia o fue denegado, abrir el input con capture="environment"
      if(onFallbackToInput) onFallbackToInput();
    }

    // ===================== PERSISTENCIA Y SINCRONIZACIÓN AUTOMÁTICA SERVER-SIDE =====================
    async function syncAllToServer(){
      try {
        const payload = {
          productos: await db.productos.toArray(),
          compras: await db.compras.toArray(),
          envios: await db.envios.toArray(),
          recepciones: await db.recepciones.toArray(),
          usuarios: await db.usuarios.toArray()
        };
        const res = await fetch("/api/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        return res.ok;
      } catch(e){
        return false;
      }
    }

    async function syncAllFromServer(){
      try {
        const res = await fetch("/api/sync");
        if(res.ok){
          const data = await res.json();
          if(data && typeof data === "object"){
            if(Array.isArray(data.deleted_productos)){
              for(const id of data.deleted_productos) await db.productos.delete(id);
            }
            if(Array.isArray(data.deleted_compras)){
              for(const id of data.deleted_compras) await db.compras.delete(id);
            }
            if(Array.isArray(data.deleted_envios)){
              for(const id of data.deleted_envios) await db.envios.delete(id);
            }
            if(Array.isArray(data.productos) && data.productos.length > 0){
              for(const p of data.productos) await db.productos.put(p);
            }
            if(Array.isArray(data.compras) && data.compras.length > 0){
              for(const c of data.compras) await db.compras.put(c);
            }
            if(Array.isArray(data.envios) && data.envios.length > 0){
              for(const ev of data.envios) await db.envios.put(ev);
            }
            if(Array.isArray(data.recepciones) && data.recepciones.length > 0){
              for(const r of data.recepciones) await db.recepciones.put(r);
            }
            return true;
          }
        }
      } catch(e){}
      return false;
    }

    async function deleteProductRecord(prodId){
      if(!prodId) return;
      await db.productos.delete(prodId);

      // Eliminar también compras asociadas para que no sigan apareciendo en recientes
      const allCompras = await db.compras.where("producto_id").equals(prodId).toArray();
      const cIds = allCompras.map(x=>x.id);
      for(const cid of cIds) await db.compras.delete(cid);

      // Eliminar envíos asociados
      const allEnvios = await db.envios.where("producto_id").equals(prodId).toArray();
      const evIds = allEnvios.map(x=>x.id);
      for(const eid of evIds) await db.envios.delete(eid);

      // Guardar en blacklist local para evitar resurrecciones
      const deletedSet = new Set(JSON.parse(localStorage.getItem("bodega_deleted_ids") || "[]"));
      deletedSet.add(prodId);
      cIds.forEach(id => deletedSet.add(id));
      localStorage.setItem("bodega_deleted_ids", JSON.stringify(Array.from(deletedSet)));

      try {
        await fetch("/api/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            deleted_productos: [prodId],
            deleted_compras: cIds,
            deleted_envios: evIds
          })
        });
      } catch(e){}
      await syncAllToServer();
    }

    async function deleteRecentCompra(compraId){
      if(!compraId) return;
      const c = await db.compras.get(compraId);
      await db.compras.delete(compraId);

      if(c && c.producto_id){
        const envios = await db.envios.where("producto_id").equals(c.producto_id).toArray();
        for(const ev of envios){
          if(ev.estado !== "RECIBIDO") await db.envios.delete(ev.id);
        }
      }

      const deletedSet = new Set(JSON.parse(localStorage.getItem("bodega_deleted_ids") || "[]"));
      deletedSet.add(compraId);
      localStorage.setItem("bodega_deleted_ids", JSON.stringify(Array.from(deletedSet)));

      try {
        await fetch("/api/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deleted_compras: [compraId] })
        });
      } catch(e){}
      await syncAllToServer();
    }

    async function showRedistributionModal(compra, onUpdated){
      const prev = $("#custom-modal");
      if(prev) prev.remove();
      
      const p = await db.productos.get(compra.producto_id) || {
        id: compra.producto_id,
        nombre: compra.nombre,
        codigo: compra.codigo,
        foto_url: compra.foto_url
      };

      const total = compra.total_piezas || (compra.paquetes * compra.piezas_por_paquete + compra.piezas_sueltas) || 0;
      const paq = compra.paquetes || 0;
      const ppp = compra.piezas_por_paquete || 0;
      const sue = compra.piezas_sueltas || 0;

      // Buscar envíos existentes para pre-llenar valores actuales
      const existingEnvios = await db.envios.where("producto_id").equals(compra.producto_id).toArray();
      const distInit = {
        M: { paq: 0, pzs: 0 },
        C: { paq: 0, pzs: 0 },
        R: { paq: 0, pzs: 0 }
      };
      existingEnvios.forEach(ev=>{
        if(distInit[ev.sucursal_destino]){
          distInit[ev.sucursal_destino].paq = ev.paquetes_enviados || 0;
          distInit[ev.sucursal_destino].pzs = ev.piezas_sueltas_enviadas || 0;
        }
      });

          <!-- Encabezado con Foto y Nombre -->

              ${p.foto_url || compra.foto_url ? `<img src="${p.foto_url || compra.foto_url}" class="w-full h-full object-cover">` : `<span class="text-2xl">📦</span>`}
            </div>

              <h3 class="font-black text-slate-900 text-sm sm:text-base leading-tight truncate" title="${escapeHtml(p.nombre)}">${escapeHtml(p.nombre)}</h3>
              <p class="text-xs text-slate-500 font-bold mt-0.5">${escapeHtml(p.codigo || "—")} · Total: <b class="text-brand-700">${total} pz</b> ${compra.desglose ? `(${compra.desglose})` : ""}</p>
            </div>
            <button id="modal-close-dist" class="text-slate-400 hover:text-slate-700 text-xl font-bold p-1 leading-none">✕</button>
          </div>

          <!-- Estado de Validación -->
          <div class="flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border border-slate-200/80">
            <span class="text-xs font-bold text-slate-700">Validación de piezas:</span>
            <span id="redist-val" class="text-xs font-black text-amber-600">Calculando...</span>
          </div>

          <!-- Inputs de Distribución -->
          <div class="grid grid-cols-3 gap-2">
            <!-- M -->
            <div class="bg-white rounded-xl p-2 border-2 border-blue-200 text-center shadow-xs space-y-1">
              <div class="flex items-center justify-center gap-1">
                <span class="w-6 h-6 rounded-lg bg-blue-600 text-white font-black text-xs flex items-center justify-center">M</span>
                <span class="text-[10px] font-bold text-blue-900">Misaki</span>
              </div>
              <div class="grid grid-cols-2 gap-1 text-[9px] font-bold text-slate-400"><span>PQ</span><span>PZ</span></div>
              <div class="grid grid-cols-2 gap-1">
                <input id="rd-M-paq" type="number" inputmode="numeric" value="${distInit.M.paq}" class="h-10 w-full rounded-lg border border-slate-300 text-center text-xs font-black text-slate-800 outline-none focus:border-blue-600" />
                <input id="rd-M-pzs" type="number" inputmode="numeric" value="${distInit.M.pzs}" class="h-10 w-full rounded-lg border border-slate-300 text-center text-xs font-black text-slate-800 outline-none focus:border-blue-600" />
              </div>
            </div>

            <!-- C -->
            <div class="bg-white rounded-xl p-2 border-2 border-purple-200 text-center shadow-xs space-y-1">
              <div class="flex items-center justify-center gap-1">
                <span class="w-6 h-6 rounded-lg bg-purple-600 text-white font-black text-xs flex items-center justify-center">C</span>
                <span class="text-[10px] font-bold text-purple-900">Chilte</span>
              </div>
              <div class="grid grid-cols-2 gap-1 text-[9px] font-bold text-slate-400"><span>PQ</span><span>PZ</span></div>
              <div class="grid grid-cols-2 gap-1">
                <input id="rd-C-paq" type="number" inputmode="numeric" value="${distInit.C.paq}" class="h-10 w-full rounded-lg border border-slate-300 text-center text-xs font-black text-slate-800 outline-none focus:border-purple-600" />
                <input id="rd-C-pzs" type="number" inputmode="numeric" value="${distInit.C.pzs}" class="h-10 w-full rounded-lg border border-slate-300 text-center text-xs font-black text-slate-800 outline-none focus:border-purple-600" />
              </div>
            </div>

            <!-- R -->
            <div class="bg-white rounded-xl p-2 border-2 border-emerald-200 text-center shadow-xs space-y-1">
              <div class="flex items-center justify-center gap-1">
                <span class="w-6 h-6 rounded-lg bg-emerald-600 text-white font-black text-xs flex items-center justify-center">R</span>
                <span class="text-[10px] font-bold text-emerald-900">Rdgz</span>
              </div>
              <div class="grid grid-cols-2 gap-1 text-[9px] font-bold text-slate-400"><span>PQ</span><span>PZ</span></div>
              <div class="grid grid-cols-2 gap-1">
                <input id="rd-R-paq" type="number" inputmode="numeric" value="${distInit.R.paq}" class="h-10 w-full rounded-lg border border-slate-300 text-center text-xs font-black text-slate-800 outline-none focus:border-emerald-600" />
                <input id="rd-R-pzs" type="number" inputmode="numeric" value="${distInit.R.pzs}" class="h-10 w-full rounded-lg border border-slate-300 text-center text-xs font-black text-slate-800 outline-none focus:border-emerald-600" />
              </div>
            </div>
          </div>

          <!-- Sugerencias rápidas con prioridad de paquetes -->
          <div class="bg-blue-50/80 border border-blue-200/80 rounded-xl p-2.5 space-y-1.5">
            <div class="flex items-center justify-between text-[11px] font-bold text-blue-900">
              <span>💡 Sugerencias (priorizan paquetes enteros):</span>
              <button id="btn-dictar-redist" class="text-blue-700 hover:text-blue-900 font-extrabold flex items-center gap-1">
                <span>🎙</span><span>Dictar voz</span>
              </button>
            </div>
            <div class="flex flex-wrap gap-1">
              <button type="button" class="btn-rd-chip px-2 py-1 bg-white border border-blue-300 hover:bg-blue-100 rounded-lg text-[10px] font-bold text-blue-900 shadow-2xs" data-cmd="partes iguales">
                ✨ Partes iguales (prioriza paq.)
              </button>
              <button type="button" class="btn-rd-chip px-2 py-1 bg-white border border-blue-300 hover:bg-blue-100 rounded-lg text-[10px] font-bold text-blue-900 shadow-2xs" data-cmd="mitad y mitad M y C">
                🌓 Mitad M y C
              </button>
              <button type="button" class="btn-rd-chip px-2 py-1 bg-white border border-blue-300 hover:bg-blue-100 rounded-lg text-[10px] font-bold text-blue-900 shadow-2xs" data-cmd="dos para cada quien y una más a Rodriguez">
                📦 2 c/u y 1 más a R
              </button>
            </div>
          </div>

          <!-- Botones de Acción -->
          <div class="flex gap-2 pt-1 border-t border-slate-100">
            <button id="btn-cancel-redist" class="flex-1 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold">Cancelar</button>
            <button id="btn-save-redist" class="flex-1 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 active:scale-95 text-white text-xs font-black shadow-md shadow-brand-600/30 flex items-center justify-center gap-1">
              <span>💾</span><span>Guardar Distribución</span>
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(m);

      const calcRedist = ()=>{
        const pppVal = ppp || (compra.piezas_por_paquete || 0);
        const dM = { paq: +m.querySelector("#rd-M-paq").value || 0, pzs: +m.querySelector("#rd-M-pzs").value || 0 };
        const dC = { paq: +m.querySelector("#rd-C-paq").value || 0, pzs: +m.querySelector("#rd-C-pzs").value || 0 };
        const dR = { paq: +m.querySelector("#rd-R-paq").value || 0, pzs: +m.querySelector("#rd-R-pzs").value || 0 };
        const sumPzs = (dM.paq * pppVal + dM.pzs) + (dC.paq * pppVal + dC.pzs) + (dR.paq * pppVal + dR.pzs);
        const valLbl = m.querySelector("#redist-val");
        if(sumPzs > total){
          valLbl.textContent = `⚠️ Supera total (${sumPzs}/${total} pz)`;
          valLbl.className = "text-xs font-black text-red-600";
        } else if(sumPzs === total && total > 0){
          valLbl.textContent = `✓ Exacto (${sumPzs}/${total} pz)`;
          valLbl.className = "text-xs font-black text-emerald-600";
        } else {
          valLbl.textContent = `Faltan distribuir ${total - sumPzs} pz (${sumPzs}/${total})`;
          valLbl.className = "text-xs font-black text-amber-600";
        }
        return { dM, dC, dR, sumPzs, pppVal };
      };

      m.querySelectorAll("input").forEach(inp=>inp.addEventListener("input", calcRedist));
      calcRedist();

      const applyCmd = cmd => {
        const res = parseDistribucion(cmd, total, paq, ppp, sue);
        if(res.ok){
          m.querySelector("#rd-M-paq").value = res.distribucion.M.paquetes;
          m.querySelector("#rd-M-pzs").value = res.distribucion.M.piezas;
          m.querySelector("#rd-C-paq").value = res.distribucion.C.paquetes;
          m.querySelector("#rd-C-pzs").value = res.distribucion.C.piezas;
          m.querySelector("#rd-R-paq").value = res.distribucion.R.paquetes;
          m.querySelector("#rd-R-pzs").value = res.distribucion.R.piezas;
          calcRedist();
          toast(res.msg || "Distribución calculada");
        } else {
          toast("No se pudo calcular la distribución", "warn");
        }
      };

      m.querySelectorAll(".btn-rd-chip").forEach(b=>{
        b.onclick = ()=>applyCmd(b.dataset.cmd);
      });

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(m.querySelector("#btn-dictar-redist")){
        m.querySelector("#btn-dictar-redist").onclick = ()=>{
          if(!SR){ toast("Sin soporte de voz en este navegador", "err"); return; }
          const r = new SR(); r.lang = "es-MX";
          toast("🎙️ Di: «partes iguales», «mitad y mitad» o «dos para cada quien...»");
          r.onresult = e => applyCmd(e.results[0][0].transcript);
          r.start();
        };
      }

      m.querySelector("#modal-close-dist").onclick = ()=>m.remove();
      m.querySelector("#btn-cancel-redist").onclick = ()=>m.remove();

      m.querySelector("#btn-save-redist").onclick = async ()=>{
        const { dM, dC, dR, sumPzs, pppVal } = calcRedist();
        if(sumPzs > total){
          toast(`La distribución excede el total (${sumPzs}/${total} pz)`, "err");
          return;
        }

        const distMap = { M: dM, C: dC, R: dR };
        const distTxt = UBICACIONES.map(u=>{
          const d = distMap[u];
          const pz = d.paq * pppVal + d.pzs;
          return pz > 0 ? `${u}:${pz}` : null;
        }).filter(Boolean).join("  ");

        // Actualizar registro de compra
        compra.dist_resumen = distTxt;
        compra.synced = false;
        await db.compras.put(compra);

        // Reemplazar envíos asociados para que reflejen la nueva distribución
        const oldEnvios = await db.envios.where("producto_id").equals(compra.producto_id).toArray();
        for(const ev of oldEnvios){
          if(ev.estado !== "RECIBIDO") await db.envios.delete(ev.id);
        }

        for(const u of UBICACIONES){
          const pz = distMap[u].paq * pppVal + distMap[u].pzs;
          if(pz > 0){
            await db.envios.put({
              id: uid(), producto_id: compra.producto_id, nombre: p.nombre, codigo: p.codigo,
              foto_url: p.foto_url || compra.foto_url, sucursal_destino: u,
              total_enviado_piezas: pz, paquetes_enviados: distMap[u].paq,
              piezas_sueltas_enviadas: distMap[u].pzs, estado: "ENVIADO",
              fecha_envio: new Date().toISOString(), synced: false
            });
          }
        }

        await syncAllToServer();
        m.remove();
        toast("Distribución guardada correctamente");
        if(onUpdated) onUpdated();
        render();
      };
    }

    // ===================== PARSER ROBUSTO =====================
    const WORD_NUMS={cero:0,uno:1,una:1,un:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,mil:1000};
    function wordsToNumber(t){
      t=(t||"").toLowerCase().trim();
      if(/^\d+$/.test(t)) return parseInt(t,10);
      return WORD_NUMS[t]??null;
    }
    function normText(t){
      return (t||"").toLowerCase()
        .replace(/[áéíóúü]/g,c=>({á:"a",é:"e",í:"i",ó:"o",ú:"u",ü:"u"}[c]))
        .replace(/\s+/g," ").trim();
    }

    function parseNombreCodigo(text){
      const norm=text.trim();
      const re=/(.+?)\s+(?:c[oó]digo|clave|modelo)\s+([A-Za-z0-9\-_]+)/i;
      const m=norm.match(re);
      if(m) return {nombre:m[1].trim(), codigo:m[2].trim().toUpperCase()};
      return {nombre:norm, codigo:""};
    }

    function parseCantidades(text){
      const norm=normText(text);
      let paquetes=0,ppp=0,sueltas=0;
      const caja=norm.match(/(\d+|\w+)\s*cajas?\s*(?:con|de)?\s*(\d+|\w+)\s*(?:paquetes?|bolsas?)/);
      if(caja){paquetes=(wordsToNumber(caja[1])||0)*(wordsToNumber(caja[2])||0);}
      const pqMatch=norm.match(/(\d+|\w+)\s*(?:paquetes?|pq|pqs)\s*(?:con|de)?\s*(\d+|\w+)?\s*(?:piezas?|pzs?|pz)?/);
      if(pqMatch && !caja){
        paquetes=wordsToNumber(pqMatch[1])||0;
        if(pqMatch[2]) ppp=wordsToNumber(pqMatch[2])||0;
      }
      const nums=[];
      norm.split(/[\s,;.]+/).forEach(tk=>{const n=wordsToNumber(tk);if(n!==null)nums.push(n);});
      if(!paquetes){
        if(nums.length===1) sueltas=nums[0];
        else if(nums.length===2){paquetes=nums[0];ppp=nums[1];}
        else if(nums.length>=3){paquetes=nums[0];ppp=nums[1];sueltas=nums[2];}
      } else if(!ppp){
        const pppM=norm.match(/(\d+|\w+)\s*(?:piezas?|pzs?|pz)\s*(?:por|cada|con)?\s*(?:paquete|bolsa)?/);
        if(pppM) ppp=wordsToNumber(pppM[1])||0;
        else if(nums.length>=2) ppp=nums[1];
      }
      const sueltaM=norm.match(/(\d+|\w+)\s*(?:piezas?|pzs?)\s*sueltas?/);
      if(sueltaM) sueltas=wordsToNumber(sueltaM[1])||0;
      const total=paquetes*ppp+sueltas;
      return {ok:total>0||paquetes>0,paquetes,ppp,sueltas,total};
    }

    // Parser de distribución con PRIORIDAD a repartición de paquetes completos
    function parseDistribucion(text, totalPiezas=0, totalPaquetes=0, ppp=0, sueltas=0){
      const norm=normText(text);
      const res={M:{paquetes:0,piezas:0},C:{paquetes:0,piezas:0},R:{paquetes:0,piezas:0}};
      let found=false;

      // Helper para convertir una cantidad objetivo de piezas en paquetes + piezas
      const splitPzsToPaq = (targetPzs) => {
        if(ppp > 0){
          return {
            paquetes: Math.floor(targetPzs / ppp),
            piezas: targetPzs % ppp
          };
        }
        return { paquetes: 0, piezas: targetPzs };
      };

      // 1. Todo a X
      let m=norm.match(/(?:todo|todas)\s+(?:para|a)\s+(\w+)/);
      if(m){
        const u=ALIAS[m[1]]||m[1].toUpperCase();
        if(UBICACIONES.includes(u)){
          if(totalPaquetes > 0 && ppp > 0){
            res[u].paquetes = totalPaquetes;
            res[u].piezas = sueltas;
          } else {
            res[u].paquetes = 0;
            res[u].piezas = totalPiezas;
          }
          return {ok:true,distribucion:res,msg:`Todo a ${u}`};
        }
      }

      // 2. Partes iguales / uno para cada quien (PRIORIZA PAQUETES COMPLETOS)
      if(/partes?\s*iguales?|uno\s+para\s+cada|igual\s+a\s+cada|a\s+todos\s+por\s+igual|parejo/.test(norm)){
        const n=UBICACIONES.length; // 3 tiendas
        if(totalPaquetes > 0 && ppp > 0){
          // Repartir paquetes completos primero
          const basePaq = Math.floor(totalPaquetes / n);
          const paqRestantes = totalPaquetes % n;
          // Piezas sobrantes: las que quedan del paquete no dividido parejo + las sueltas
          const pzSobrantes = (paqRestantes * ppp) + sueltas;
          const basePzs = Math.floor(pzSobrantes / n);
          let extraPz = pzSobrantes % n;

          UBICACIONES.forEach(u=>{
            res[u].paquetes = basePaq;
            res[u].piezas = basePzs + (extraPz > 0 ? 1 : 0);
            if(extraPz > 0) extraPz--;
          });
          return {ok:true,distribucion:res,msg:"Partes iguales (priorizando paquetes completos)"};
        } else {
          const base=Math.floor(totalPiezas/n);
          let extra=totalPiezas%n;
          UBICACIONES.forEach(u=>{
            res[u].paquetes = 0;
            res[u].piezas = base + (extra>0?1:0);
            if(extra>0) extra--;
          });
          return {ok:true,distribucion:res,msg:"Partes iguales en piezas"};
        }
      }

      // 3. Mitad y mitad (PRIORIZA PAQUETES COMPLETOS)
      if(/mitad/.test(norm)){
        const locs=[];
        for(const [a,u] of Object.entries(ALIAS)){
          if(norm.includes(a) && !locs.includes(u)) locs.push(u);
        }
        if(locs.length < 2){
          if(!locs.includes("M")) locs.push("M");
          if(!locs.includes("C") && locs.length < 2) locs.push("C");
        }
        if(locs.length>=2){
          const l1 = locs[0], l2 = locs[1];
          if(totalPaquetes > 0 && ppp > 0){
            const basePaq = Math.floor(totalPaquetes / 2);
            const paqRest = totalPaquetes % 2;
            const pzSobrantes = (paqRest * ppp) + sueltas;
            const halfPzs = Math.floor(pzSobrantes / 2);
            const remPz = pzSobrantes % 2;
            res[l1].paquetes = basePaq;
            res[l1].piezas = halfPzs + remPz;
            res[l2].paquetes = basePaq;
            res[l2].piezas = halfPzs;
          } else {
            const half=Math.floor(totalPiezas/2);
            res[l1].piezas=totalPiezas-half;
            res[l2].piezas=half;
          }
          return {ok:true,distribucion:res,msg:`Mitad a ${l1} y mitad a ${l2}`};
        }
      }

      // 4. "dos para cada quien y una más a R" / "X para cada quien y Y más a Z"
      const cadaQuienM = norm.match(/(\d+|\w+)\s+(?:para|a)?\s*(?:cada\s*(?:quien|uno|tienda)|todos)/);
      if(cadaQuienM){
        const cantBase = wordsToNumber(cadaQuienM[1]) || 0;
        if(cantBase > 0){
          const asumePaquetes = totalPaquetes > 0 && (cantBase * UBICACIONES.length <= totalPaquetes);
          UBICACIONES.forEach(u=>{
            if(asumePaquetes){
              res[u].paquetes = cantBase;
            } else {
              const sp = splitPzsToPaq(cantBase);
              res[u].paquetes = sp.paquetes;
              res[u].piezas = sp.piezas;
            }
          });
          const extraM = norm.match(/(\d+|\w+)\s*(?:m[aá]s)?\s*(?:a|para)\s*(\w+)/);
          if(extraM){
            const extNum = wordsToNumber(extraM[1]) || 0;
            const extU = ALIAS[extraM[2]] || extraM[2].toUpperCase();
            if(UBICACIONES.includes(extU)){
              if(asumePaquetes){
                res[extU].paquetes += extNum;
              } else {
                res[extU].piezas += extNum;
              }
            }
          }
          return {ok:true,distribucion:res,msg:`${cantBase} para cada quien`};
        }
      }

      // 5. Asignaciones explícitas con paquetes o piezas
      const explicit={M:{paquetes:0,piezas:0},C:{paquetes:0,piezas:0},R:{paquetes:0,piezas:0}};
      
      const rePaq = /(\d+|\w+)\s*(?:paquetes?|pq|pqs)\s*(?:para|a|en)?\s*(\w+)/g;
      let mp;
      while((mp = rePaq.exec(norm)) !== null){
        const n = wordsToNumber(mp[1]) || 0;
        const u = ALIAS[mp[2]] || mp[2].toUpperCase();
        if(UBICACIONES.includes(u)){
          explicit[u].paquetes += n;
          found = true;
        }
      }

      const rePz = /(\d+|\w+)\s*(?:piezas?|pzs?)\s*(?:para|a|en)?\s*(\w+)/g;
      while((mp = rePz.exec(norm)) !== null){
        const n = wordsToNumber(mp[1]) || 0;
        const u = ALIAS[mp[2]] || mp[2].toUpperCase();
        if(UBICACIONES.includes(u)){
          explicit[u].piezas += n;
          found = true;
        }
      }

      if(!found){
        const reSimple = /(\d+)\s*(?:para|a|en)?\s*(\w+)/g;
        while((mp = reSimple.exec(norm)) !== null){
          const num = +mp[1];
          const u = ALIAS[mp[2]] || mp[2].toUpperCase();
          if(UBICACIONES.includes(u)){
            if(totalPaquetes > 0 && num <= totalPaquetes && ppp > 0){
              explicit[u].paquetes += num;
            } else {
              const sp = splitPzsToPaq(num);
              explicit[u].paquetes += sp.paquetes;
              explicit[u].piezas += sp.piezas;
            }
            found = true;
          }
        }
      }

      if(found){
        UBICACIONES.forEach(u=>{
          res[u].paquetes = explicit[u].paquetes;
          res[u].piezas = explicit[u].piezas;
        });

        if(/resto|dem[aá]s|restante|sobrante/.test(norm)){
          const assignedPzs = UBICACIONES.reduce((s,u)=> s + res[u].paquetes*(ppp||0) + res[u].piezas, 0);
          const restoPzs = Math.max(0, totalPiezas - assignedPzs);
          if(restoPzs > 0){
            let restoLoc = null;
            let rm = norm.match(/(?:resto|dem[aá]s|restante|sobrante)\s*(?:a|para|en)?\s*(\w+)/);
            if(rm){
              const u = ALIAS[rm[1]] || rm[1].toUpperCase();
              if(UBICACIONES.includes(u)) restoLoc = u;
            }
            if(!restoLoc){
              restoLoc = UBICACIONES.find(u => res[u].paquetes === 0 && res[u].piezas === 0) || "R";
            }
            if(restoLoc){
              if(ppp > 0){
                res[restoLoc].paquetes += Math.floor(restoPzs / ppp);
                res[restoLoc].piezas += restoPzs % ppp;
              } else {
                res[restoLoc].piezas += restoPzs;
              }
            }
          }
        }
        return {ok:true, distribucion:res, msg:"Distribución asignada"};
      }

      return {ok:false};
    }

    async function procesarImagen(file){
      return new Promise(resolve=>{
        const reader=new FileReader();
        reader.onload=e=>{
          const img=new Image();
          img.onload=()=>{
            // Recorte y escala a 120x120 centrado de excelente calidad y peso ultraliviano (~8-15KB)
            const targetSize = 120;
            let w = img.width, h = img.height;
            let sSize = Math.min(w, h);
            let sx = Math.floor((w - sSize) / 2);
            let sy = Math.floor((h - sSize) / 2);

            const c=document.createElement("canvas");
            c.width=targetSize;
            c.height=targetSize;
            const ctx=c.getContext("2d");
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = "high";
            ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, targetSize, targetSize);
            c.toBlob(b=>resolve(b),"image/jpeg",0.80);
          };
          img.src=e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function restaurarRespaldo(json){
      if(!json || typeof json !== "object"){
        toast("Formato de respaldo no válido","err");

      if(Array.isArray(json.productos)){
        for(const p of json.productos){
          await db.productos.put(p);
          prodsCount++;
        }
      }
      if(Array.isArray(json.compras)){
        for(const c of json.compras){ await db.compras.put(c); }
      }
      if(Array.isArray(json.envios)){
        for(const ev of json.envios){ await db.envios.put(ev); }
      }
      if(Array.isArray(json.recepciones)){
        for(const r of json.recepciones){ await db.recepciones.put(r); }
      }
      if(Array.isArray(json.usuarios)){
        for(const u of json.usuarios){ await db.usuarios.put(u); }
      }
      // Sincronizar con el servidor de inmediato
      await syncAllToServer();
      toast(`¡Éxito! Se importaron ${prodsCount} producto(s)`);
      render();
    }
