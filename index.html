        else if (k === "html") n.innerHTML = v;
        else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);

    function toast(msg, type="ok") {

    function renderToast() {

        t = el("div", {id:"toast", class:"fixed bottom-16 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 rounded-xl shadow-lg text-white text-sm font-medium max-w-[90%] text-center"});

        (state.toast.type==="ok" ? "bg-emerald-600" : state.toast.type==="warn" ? "bg-amber-500" : "bg-red-600");
      t.textContent = state.toast.msg;

    // ===================== VOZ =====================
    const WORD_NUMS = {
      cero:0,uno:1,una:1,un:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,
      once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,
      sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,mil:1000
    };
    function wordsToNumber(t) {
      t = (t||"").toLowerCase().trim();
      if (/^\d+$/.test(t)) return parseInt(t,10);
      return WORD_NUMS[t] ?? null;
    }

    // Dictado Nombre + Código
    function parseNombreCodigo(text) {
      const norm = text.trim();
      // Busca "código/clave/modelo XXX"
      const re = /(.+?)\s+(?:c[oó]digo|clave|modelo)\s+([A-Za-z0-9\-_]+)/i;
      const m = norm.match(re);
      if (m) {
        return { nombre: m[1].trim(), codigo: m[2].trim().toUpperCase() };
      }
      // Si no hay indicador de código → todo es nombre y código = SC
      return { nombre: norm, codigo: "SC" };
    }

    function parseCantidades(text) {
      const norm = text.toLowerCase().replace(/[áéíóú]/g, c => ({á:"a",é:"e",í:"i",ó:"o",ú:"u"}[c]));
      let paquetes = 0, ppp = 0, sueltas = 0;

      // 2 cajas con 24 paquetes de 10
      const caja = norm.match(/(\d+|\w+)\s*cajas?\s*(?:con|de)?\s*(\d+|\w+)\s*(?:paquetes?|bolsas?)/);
      if (caja) {
        const nc = wordsToNumber(caja[1]) || 0;
        const np = wordsToNumber(caja[2]) || 0;
        paquetes = nc * np;
      }

      const nums = [];
      norm.split(/[\s,;.]+/).forEach(tk => {
        const n = wordsToNumber(tk);
        if (n !== null) nums.push(n);
      });

      if (!paquetes) {
        if (nums.length === 1) sueltas = nums[0];
        else if (nums.length === 2) { paquetes = nums[0]; ppp = nums[1]; }
        else if (nums.length >= 3) { paquetes = nums[0]; ppp = nums[1]; sueltas = nums[2]; }
      } else {
        const pppM = norm.match(/(\d+|\w+)\s*piezas?\s*(?:por\s*)?(?:paquete|bolsa)/);
        if (pppM) ppp = wordsToNumber(pppM[1]) || 0;
        else if (nums.length >= 2) ppp = nums[1];
        const sueltaM = norm.match(/(\d+|\w+)\s*piezas?\s*sueltas?/);
        if (sueltaM) sueltas = wordsToNumber(sueltaM[1]) || 0;
      }

      const total = paquetes * ppp + sueltas;
      return { ok: total > 0 || paquetes > 0, paquetes, ppp, sueltas, total };
    }

    function parseDistribucion(text, totalPiezas = 0) {
      const norm = text.toLowerCase()
        .replace(/[áéíóú]/g, c => ({á:"a",é:"e",í:"i",ó:"o",ú:"u"}[c]))
        .replace(/\by\b/g, " ");
      const res = { M:{paquetes:0,piezas:0}, C:{paquetes:0,piezas:0}, R:{paquetes:0,piezas:0} };
      let found = false;

      if (/todo\s+(?:para|a)\s+(\w+)/.test(norm)) {
        const u = ALIAS[RegExp.$1] || RegExp.$1.toUpperCase();
        if (UBICACIONES.includes(u)) {
          res[u].piezas = totalPiezas;
          return { ok:true, distribucion:res };
        }
      }
      if (/cada\s+(uno|quien|lugar)/.test(norm)) {
        const n = wordsToNumber(norm.match(/(\d+|\w+)\s*(?:a\s+)?cada/)?.[1]) || 1;
        UBICACIONES.forEach(u => res[u].paquetes = n);
        return { ok:true, distribucion:res };
      }
      for (const [alias, ubic] of Object.entries(ALIAS)) {
        const re = new RegExp(`(\\d+|\\w+)\\s*(?:paquetes?|piezas?)?\\s*(?:para|a|en)?\\s*${alias}`, "i");
        const m = norm.match(re);
        if (m) {
          const n = wordsToNumber(m[1]) ?? parseInt(m[1]) ?? 0;
          if (norm.includes("pieza")) res[ubic].piezas += n;
          else res[ubic].paquetes += n;
          found = true;
        }
      }
      const corto = norm.match(/(\d+)\s*m\s*(\d+)\s*c\s*(\d+)\s*r/i) || norm.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if (corto) {
        res.M.paquetes = +corto[1] || 0;
        res.C.paquetes = +corto[2] || 0;
        res.R.paquetes = +corto[3] || 0;
        found = true;
      }
      return found ? { ok:true, distribucion:res } : { ok:false };
    }

    // ===================== IMAGEN =====================
    async function procesarImagen(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement("canvas");
            c.width = 96; c.height = 96;
            const ctx = c.getContext("2d");
            const r = Math.max(96/img.width, 96/img.height);
            ctx.drawImage(img, (96-img.width*r)/2, (96-img.height*r)/2, img.width*r, img.height*r);
            c.toBlob(b => resolve(b), "image/webp", 0.7);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    async function subirImagen(blob) {
      if (!supabase || !state.online) return null;
      const path = `productos/${uid()}.webp`;
      const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(path, blob, { contentType:"image/webp" });
      if (error) throw error;
      return supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    // ===================== AUTH + CONFIG =====================
    async function login(codigo, pin) {
      codigo = codigo.trim().toUpperCase();
      if (supabase && state.online) {
        const { data } = await supabase.from("usuarios").select("*").eq("id",codigo).eq("pin",pin).maybeSingle();
        if (data) { await db.usuarios.put({...data, synced:true}); return data; }
      }
      const local = await db.usuarios.get(codigo);
      return (local && local.pin === pin) ? local : null;
    }

    async function getConfig(key, def="") {

    async function setConfig(key, value) {
      await db.config.put({key, value});

          const ppp = +$("#p-ppp").value || 0;
          const sue = +$("#p-sueltas").value || 0;
          const total = paq * ppp + sue;

          const dist = {
            M: {paquetes:+$("#d-M-paq").value||0, piezas:+$("#d-M-pzs").value||0},

          const val = $("#d-validacion");
          if (distTotal > total) { val.textContent = "Supera el total"; val.className = "text-xs font-medium text-red-600"; }
          else if (distTotal === total && total > 0) { val.textContent = "Distribución completa"; val.className = "text-xs font-medium text-emerald-600"; }
          else { val.textContent = "Falta distribuir"; val.className = "text-xs font-medium text-amber-600"; }
          return { total, dist, ppp, paq, sue };
        };
        ["#p-paquetes","#p-ppp","#p-sueltas","#d-M-paq","#d-M-pzs","#d-C-paq","#d-C-pzs","#d-R-paq","#d-R-pzs"]
          .forEach(s => $(s)?.addEventListener("input", calc));

        // Foto: clic = capturar / long-press = borrar
        const fotoBox = $("#foto-box");
        fotoBox.onclick = () => $("#foto-input").click();
        fotoBox.addEventListener("touchstart", e => {
          longPressTimer = setTimeout(() => {
            fotoBlob = null;
            fotoBox.innerHTML = `<span class="text-2xl">📷</span><span>Capturar</span>`;
            fotoBox.className = "w-[4.5rem] h-[4.5rem] rounded-xl bg-brand-600 text-white flex flex-col items-center justify-center text-xs font-semibold cursor-pointer select-none";
            toast("Foto eliminada");
          }, 600);
        });
        fotoBox.addEventListener("touchend", () => clearTimeout(longPressTimer));
        fotoBox.addEventListener("touchmove", () => clearTimeout(longPressTimer));

        $("#foto-input").onchange = async e => {
          const f = e.target.files[0];
          if (!f) return;
          fotoBlob = await procesarImagen(f);
          fotoBox.innerHTML = `<img src="${URL.createObjectURL(fotoBlob)}" class="w-full h-full object-cover rounded-xl">`;
          fotoBox.className = "w-[4.5rem] h-[4.5rem] rounded-xl overflow-hidden cursor-pointer";
        };

        // Dictados (independientes)
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const startDict = (handler) => {
          if (!SR) { toast("Sin soporte de voz","err"); return; }
          const r = new SR();
          r.lang = "es-MX";
          r.onresult = e => handler(e.results[0][0].transcript);
          r.onerror = () => toast("Error de voz","err");
          r.start();
        };

        $("#btn-dictar-nc").onclick = () => startDict(texto => {
          const { nombre, codigo } = parseNombreCodigo(texto);
          $("#p-nombre").value = nombre;
          $("#p-codigo").value = codigo;
          toast(codigo === "SC" ? "Nombre capturado (sin código)" : "Nombre + Código capturados");
        });

        $("#btn-dictar-cant").onclick = () => startDict(texto => {
          const res = parseCantidades(texto);
          if (res.ok) {
            $("#p-paquetes").value = res.paquetes;
            $("#p-ppp").value = res.ppp;
            $("#p-sueltas").value = res.sueltas;
            calc();
            toast(`Cantidades: ${res.total} pz`);
          } else toast("No entendí cantidades","warn");
        });

        $("#btn-dictar-dist").onclick = () => startDict(texto => {
          const { total } = calc();
          const res = parseDistribucion(texto, total);
          if (res.ok) {
            UBICACIONES.forEach(u => {
              $(`#d-${u}-paq`).value = res.distribucion[u].paquetes;
              $(`#d-${u}-pzs`).value = res.distribucion[u].piezas;
            });
            calc();
            toast("Distribución aplicada");
          } else toast("No entendí distribución","warn");
        });

        // Guardar
        $("#btn-guardar").onclick = async () => {
          const nombre = $("#p-nombre").value.trim();
          if (!nombre) { toast("Nombre obligatorio","err"); return; }
          const { total, dist, ppp, paq, sue } = calc();
          if (total <= 0) { toast("Indica cantidades","err"); return; }

          let codigo = $("#p-codigo").value.trim().toUpperCase() || "SC";
          const proveedor = $("#p-proveedor").value.trim();
          const nota = hoyNota();
          if (proveedor) await setConfig("last_proveedor", proveedor);

          // Buscar existente por código o nombre
          let prod = null;
          if (codigo !== "SC") {
            prod = await db.productos.where("codigo").equals(codigo).first();
          }
          if (!prod) {
            const todos = await db.productos.toArray();
            prod = todos.find(p => p.nombre.toLowerCase() === nombre.toLowerCase());
          }

          if (!prod) {
            prod = {
              id: uid(),
              codigo,
              nombre,
              estado: "activo",
              stock_total_bodega: total,
              piezas_por_paquete: ppp,
              precio_base: +$("#p-precio").value || null,
              creado_en: new Date().toISOString(),
              synced: false
            };
          } else {
            prod.stock_total_bodega = (prod.stock_total_bodega || 0) + total;
            prod.synced = false;
            if ($("#p-precio").value) prod.precio_base = +$("#p-precio").value;
          }
          await db.productos.put(prod);

          let fUrl = null;
          if (fotoBlob) {
            try { fUrl = await subirImagen(fotoBlob); } catch(e) {}
          }

          const desglose = paq > 0 && ppp > 0
            ? (sue > 0 ? `${paq} PQ CON ${ppp} PZ + ${sue} = ${total} PZ` : `${paq} PQ CON ${ppp} PZ = ${total} PZ`)
            : `${total} PZ`;

          await db.compras.put({
            id: uid(),
            producto_id: prod.id,
            codigo: prod.codigo,
            nombre: prod.nombre,
            fecha: new Date().toISOString().slice(0,10),
            proveedor,
            nota,
            foto_url: fUrl,
            paquetes: paq,
            piezas_por_paquete: ppp,
            piezas_sueltas: sue,
            total_piezas: total,
            desglose,
            creado_en: new Date().toISOString(),
            creado_por: state.user.id,
            synced: false
          });

          // Crear envíos si hay distribución
          for (const u of UBICACIONES) {
            const pz = dist[u].paquetes * ppp + dist[u].piezas;
            if (pz > 0) {
              await db.envios.put({
                id: uid(),
                producto_id: prod.id,
                nombre: prod.nombre,
                codigo: prod.codigo,
                sucursal_destino: u,
                total_enviado_piezas: pz,
                paquetes_enviados: dist[u].paquetes,
                piezas_sueltas_enviadas: dist[u].piezas,
                estado: "ENVIADO",
                fecha_envio: new Date().toISOString(),
                synced: false
              });
            }
          }

          toast("Producto guardado");
          // Limpiar (mantener proveedor)
          $("#p-nombre").value = "";
          $("#p-codigo").value = "";
          $("#p-paquetes").value = 0;
          $("#p-ppp").value = 0;
          $("#p-sueltas").value = 0;
          $("#p-precio").value = "";
          UBICACIONES.forEach(u => { $(`#d-${u}-paq`).value = 0; $(`#d-${u}-pzs`).value = 0; });
          fotoBlob = null;
          fotoBox.innerHTML = `<span class="text-2xl">📷</span><span>Capturar</span>`;
          fotoBox.className = "w-[4.5rem] h-[4.5rem] rounded-xl bg-brand-600 text-white flex flex-col items-center justify-center text-xs font-semibold cursor-pointer select-none";
          calc();
          cargarLista();
        };

        async function cargarLista() {
          const compras = await db.compras.orderBy("creado_en").reverse().limit(12).toArray();
          list.innerHTML = compras.length ? compras.map(c => `
            <div class="bg-white rounded-lg p-2 shadow-sm flex gap-2 items-center text-xs" data-id="${c.id}">
              ${c.foto_url
                ? `<img src="${c.foto_url}" class="w-10 h-10 rounded object-cover">`
                : `<div class="w-10 h-10 rounded bg-slate-100 flex items-center justify-center text-[10px]">📦</div>`}
              <div class="flex-1 min-w-0">
                <p class="font-semibold truncate">${escapeHtml(c.nombre)}</p>
                <p class="text-slate-500">${c.desglose || c.total_piezas+" pz"} · ${c.nota || ""}</p>
              </div>
            </div>
          `).join("") : `<p class="text-xs text-slate-400 text-center py-3">Sin registros aún</p>`;

          // Long-press para eliminar
          list.querySelectorAll("[data-id]").forEach(row => {
            let timer;
            row.addEventListener("touchstart", () => {
              timer = setTimeout(async () => {
                if (confirm("¿Eliminar este registro?")) {
                  await db.compras.delete(row.dataset.id);
                  toast("Eliminado");
                  cargarLista();
                }
              }, 700);
            });
            row.addEventListener("touchend", () => clearTimeout(timer));
            row.addEventListener("touchmove", () => clearTimeout(timer));
          });
        }
        cargarLista();
        calc();
      }, 0);

      return wrap;
    }

    // ===================== PRECIOS =====================
    function renderConsultar() {
      const wrap = el("div", {class:"space-y-2"});
      wrap.appendChild(el("h2", {class:"text-base font-bold text-brand-900"}, "Consulta de precios"));
      const search = el("input", {
        type:"text", id:"c-search",
        placeholder:"🔍 Nombre o código...",
        class:"w-full px-3 py-2 rounded-xl border text-sm outline-none"
      });
      wrap.appendChild(search);
      const list = el("div", {id:"c-list", class:"space-y-1.5"});
      wrap.appendChild(list);

      setTimeout(async () => {
        const prods = await db.productos.orderBy("nombre").toArray();
        const renderList = (q = "") => {
          const filt = prods.filter(p =>
            !q ||
            (p.nombre||"").toLowerCase().includes(q.toLowerCase()) ||
            (p.codigo||"").toLowerCase().includes(q.toLowerCase())
          );
          list.innerHTML = filt.length ? filt.map(p => `
            <div class="bg-white rounded-xl p-2.5 shadow-sm flex gap-2 items-center">
              ${p.foto_url
                ? `<img src="${p.foto_url}" class="w-11 h-11 rounded-lg object-cover">`
                : `<div class="w-11 h-11 rounded-lg bg-slate-100 flex items-center justify-center text-sm">📦</div>`}
              <div class="flex-1 min-w-0">
                <p class="font-semibold text-sm truncate">${escapeHtml(p.nombre)}</p>
                <p class="text-[10px] text-slate-500">${escapeHtml(p.codigo)}</p>
              </div>
              <p class="font-bold text-brand-600 text-sm">${p.precio_base != null ? "$"+Number(p.precio_base).toLocaleString("es-MX") : "—"}</p>
            </div>
          `).join("") : `<p class="text-xs text-slate-400 text-center py-6">Sin productos</p>`;
        };
        renderList();
        search.oninput = () => renderList(search.value);
      }, 0);
      return wrap;
    }

    // ===================== REPORTES =====================
    function renderReportes() {
      const wrap = el("div", {class:"space-y-2"});
      wrap.appendChild(el("h2", {class:"text-base font-bold text-brand-900"}, "Reportes"));

      const tabs = el("div", {class:"flex gap-1.5"});
      ["compra","traslado","diferencias"].forEach(t => {
        tabs.appendChild(el("button", {
          class: `px-3 py-1.5 rounded-full text-xs font-medium ${state.rtab===t ? "bg-brand-600 text-white" : "bg-white shadow text-slate-600"}`,
          onclick: () => { state.rtab = t; render(); }
        }, t.toUpperCase()));
      });
      wrap.appendChild(tabs);

      const body = el("div", {id:"rep-body", class:"mt-2 space-y-1.5"});
      wrap.appendChild(body);

      setTimeout(async () => {
        const tab = state.rtab || "compra";

        if (tab === "compra") {
          const compras = await db.compras.orderBy("fecha").reverse().toArray();
          const porNota = {};
          compras.forEach(c => {
            const k = c.nota || "SIN-NOTA";
            if (!porNota[k]) porNota[k] = { nota:k, proveedor:c.proveedor, fecha:c.fecha, items:[] };
            porNota[k].items.push(c);
          });

          body.innerHTML = Object.values(porNota).map(g => `
            <div class="bg-white rounded-xl p-3 shadow-sm">
              <div class="flex justify-between items-center mb-2">
                <div>
                  <p class="font-bold text-sm">COMPRA ${escapeHtml(g.nota)}</p>
                  <p class="text-[10px] text-slate-500">${escapeHtml(g.proveedor||"Sin proveedor")} · ${g.fecha}</p>
                </div>
                <button data-nota="${g.nota}" class="btn-pdf px-2.5 py-1 bg-brand-600 text-white rounded-lg text-[10px] font-semibold">PDF</button>
              </div>
              ${g.items.map(c => `
                <div class="flex gap-2 items-center py-1.5 border-t border-slate-100 text-xs">
                  ${c.foto_url ? `<img src="${c.foto_url}" class="w-10 h-10 rounded object-cover">` : `<div class="w-10 h-10 rounded bg-slate-100 flex items-center justify-center">📦</div>`}
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold truncate">${escapeHtml(c.nombre)}</p>
                    <p class="text-slate-500">${escapeHtml(c.codigo)} · ${c.desglose || c.total_piezas+" pz"}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          `).join("") || `<p class="text-xs text-slate-400 text-center py-6">No hay compras</p>`;

          body.querySelectorAll(".btn-pdf").forEach(btn => {
            btn.onclick = () => generarPDFCompra(btn.dataset.nota, porNota[btn.dataset.nota]);
          });
        }
        else if (tab === "traslado") {
          const envios = await db.envios.where("estado").equals("ENVIADO").toArray();
          body.innerHTML = envios.length ? envios.map(e => `
            <div class="bg-white rounded-xl p-3 shadow-sm text-xs">
              <p class="font-semibold">${escapeHtml(e.nombre || "Producto")}</p>
              <p class="text-slate-500">→ ${e.sucursal_destino} · ${e.total_enviado_piezas || 0} pz · ${e.estado}</p>
            </div>
          `).join("") : `<p class="text-xs text-slate-400 text-center py-6">Nada en tránsito</p>`;
        }
        else {
          body.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Diferencias (próximamente)</p>`;
        }
      }, 0);
      return wrap;
    }

    function generarPDFCompra(nota, grupo) {
      const w = window.open("", "_blank");
      if (!w) { toast("Permite ventanas emergentes","warn"); return; }
      const filas = grupo.items.map(c => `
        <tr>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;">
            ${c.foto_url ? `<img src="${c.foto_url}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;">` : "📦"}
          </td>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;">
            <b>${escapeHtml(c.nombre)}</b><br>
            <span style="color:#64748b;font-size:12px;">${escapeHtml(c.codigo)}</span>
          </td>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;font-size:13px;">
            ${escapeHtml(c.desglose || (c.total_piezas + " pz"))}
          </td>
        </tr>
      `).join("");

      w.document.write(`<!DOCTYPE html><html><head><title>COMPRA ${nota}</title>
        <style>
          body{font-family:Arial,sans-serif;padding:24px;color:#0f172a;}
          h1{font-size:20px;margin:0 0 4px;}
          .meta{color:#64748b;font-size:13px;margin-bottom:20px;}
          table{width:100%;border-collapse:collapse;}
          th{text-align:left;padding:8px;border-bottom:2px solid #0f172a;font-size:12px;}
        </style></head><body>
          <h1>COMPRA ${escapeHtml(nota)}</h1>
          <div class="meta">Proveedor: <b>${escapeHtml(grupo.proveedor||"—")}</b> · Fecha: ${grupo.fecha}</div>
          <table>
            <thead><tr><th>Foto</th><th>Producto</th><th>Cantidad</th></tr></thead>
            <tbody>${filas}</tbody>
          </table>
          <script>setTimeout(()=>window.print(),400);<\/script>
        </body></html>`);
      w.document.close();
    }

    // ===================== CONFIG USUARIOS =====================
    function renderConfig() {
      const wrap = el("div", {class:"space-y-3"});
      wrap.appendChild(el("h2", {class:"text-base font-bold text-brand-900"}, "Usuarios"));

      const list = el("div", {id:"user-list", class:"space-y-1.5"});
      wrap.appendChild(list);

      const form = el("div", {class:"bg-white rounded-xl p-3 shadow-sm space-y-2"});
      form.innerHTML = `
        <p class="text-xs font-semibold text-slate-600">Agregar usuario</p>
        <div class="grid grid-cols-2 gap-2">
          <input id="nu-id" class="px-2.5 py-2 rounded-lg border text-sm uppercase outline-none" placeholder="Código (M2)" />
          <input id="nu-pin" class="px-2.5 py-2 rounded-lg border text-sm text-center outline-none" placeholder="PIN 4 dígitos" maxlength="4" inputmode="numeric" />
        </div>
        <select id="nu-rol" class="w-full px-2.5 py-2 rounded-lg border text-sm outline-none">
          <option value="sucursal">Sucursal</option>
          <option value="admin">Admin</option>
        </select>
        <button id="nu-save" class="w-full bg-brand-600 text-white py-2 rounded-lg text-sm font-bold">Agregar</button>
      `;
      wrap.appendChild(form);

      setTimeout(async () => {
        async function cargarUsers() {
          const users = await db.usuarios.toArray();
          list.innerHTML = users.map(u => `
            <div class="bg-white rounded-xl p-2.5 shadow-sm flex justify-between items-center text-sm">
              <div>
                <p class="font-semibold">${escapeHtml(u.id)}</p>
                <p class="text-[10px] text-slate-500">${u.rol}</p>
              </div>
              <button data-id="${u.id}" class="del-user text-xs text-red-600 font-semibold">Eliminar</button>
            </div>
          `).join("");
          list.querySelectorAll(".del-user").forEach(btn => {
            btn.onclick = async () => {
              if (btn.dataset.id === state.user.id) { toast("No puedes eliminarte","err"); return; }
              if (confirm("¿Eliminar usuario " + btn.dataset.id + "?")) {
                await db.usuarios.delete(btn.dataset.id);
                toast("Usuario eliminado");
                cargarUsers();
              }
            };
          });
        }
        cargarUsers();

        $("#nu-save").onclick = async () => {
          const id = $("#nu-id").value.trim().toUpperCase();
          const pin = $("#nu-pin").value.trim();
          const rol = $("#nu-rol").value;
          if (!id || !/^\d{4}$/.test(pin)) { toast("Código y PIN de 4 dígitos","err"); return; }
          if (await db.usuarios.get(id)) { toast("Ya existe","err"); return; }
          await db.usuarios.put({ id, pin, rol, synced:false });
          toast("Usuario " + id + " creado");
          $("#nu-id").value = "";
          $("#nu-pin").value = "";
          cargarUsers();
        };
      }, 0);
      return wrap;
    }

    function renderRecibir() {
      return el("div", {class:"p-3"},
        el("h2", {class:"text-base font-bold mb-2"}, "Recibir"),
        el("p", {class:"text-sm text-slate-500"}, "Confirmación de lote con una sola firma (próxima mejora).")
      );
    }

    // ===================== INIT =====================
    async function init() {
      await seed();
      window.addEventListener("online", () => { state.online = true; });
      window.addEventListener("offline", () => { state.online = false; });
      render();
    }
    init();
  </script>
</body>
