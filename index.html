      recHeader.innerHTML = `
        <span class="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">
          <span>📋</span><span>Registros recientes</span>
        </span>
        <span class="text-[11px] text-slate-500 font-medium">Toca precio para editar</span>
      `;
      wrap.appendChild(recHeader);

      const list=el("div",{id:"lista-reciente",class:"space-y-2 max-h-80 sm:max-h-96 overflow-y-auto pr-1"});
      wrap.appendChild(list);

      let fotoBlob=null;

      setTimeout(async()=>{
        if(!$("#p-proveedor").value) {
          $("#p-proveedor").value=await getConfig("last_proveedor","");
        }
        $("#p-nota-auto").textContent=hoyNota();

        const fotoBox=$("#foto-preview-box");

        // Restore draft photo if exists
        if(state.draft.fotoDataUrl && fotoBox){
          fotoBox.innerHTML=`<img src="${state.draft.fotoDataUrl}" class="w-full h-full object-cover"><span class="absolute inset-x-0 bottom-0 bg-black/60 text-white text-[8px] font-bold py-0.5 text-center">Toca p/ ver</span>`;
        }

        // Setup draft cleaner
        const clearBtn = $("#btn-clear-draft");
        if(clearBtn){
          clearBtn.onclick = ()=>{
            showAdminConfirm("¿Limpiar borrador?", "Se borrarán los campos que estabas llenando.", ()=>{
              clearDraft();
              render();
            });
          };
        }

        const updateDraft = ()=>{
          state.draft.nombre = $("#p-nombre").value;
          state.draft.codigo = $("#p-codigo").value;
          state.draft.paquetes = +$("#p-paquetes").value || 0;
          state.draft.ppp = +$("#p-ppp").value || 0;
          state.draft.sueltas = +$("#p-sueltas").value || 0;
          state.draft.dMpaq = +$("#d-M-paq").value || 0;
          state.draft.dMpzs = +$("#d-M-pzs").value || 0;
          state.draft.dCpaq = +$("#d-C-paq").value || 0;
          state.draft.dCpzs = +$("#d-C-pzs").value || 0;
          state.draft.dRpaq = +$("#d-R-paq").value || 0;
          state.draft.dRpzs = +$("#d-R-pzs").value || 0;
          state.draft.precio = $("#p-precio").value;
          state.draft.proveedor = $("#p-proveedor").value;
          saveDraft();
        };

        ["#p-paquetes","#p-ppp","#p-sueltas","#d-M-paq","#d-M-pzs","#d-C-paq","#d-C-pzs","#d-R-paq","#d-R-pzs"].forEach(sel=>{
          const inp=$(sel); if(!inp) return;
          inp.addEventListener("focus",()=>{if(inp.value==="0")inp.value="";});
          inp.addEventListener("blur",()=>{if(inp.value==="")inp.value="0";updateDraft();});
        });

        $("#p-nombre").addEventListener("input", updateDraft);
        $("#p-precio").addEventListener("input", updateDraft);
        $("#p-proveedor").addEventListener("input", updateDraft);

        // Verification of existing code & autocomplete suggestion
        const checkExistingCode = async ()=>{
          const cod = $("#p-codigo").value.trim().toUpperCase();
          const avisoBox = $("#codigo-aviso");
          if(!cod){ avisoBox.className="hidden"; avisoBox.innerHTML=""; return; }
          const existing = await db.productos.where("codigo").equals(cod).first();
          if(existing){
            avisoBox.className = "bg-amber-50 border border-amber-300 rounded-xl p-2.5 text-xs text-amber-900 space-y-1.5 animate-in fade-in";
            avisoBox.innerHTML = `
              <div class="flex items-center gap-1.5 font-bold">
                <span>⚠️</span>
                <span>El código <b>${escapeHtml(existing.codigo)}</b> ya existe: "${escapeHtml(existing.nombre)}"</span>
              </div>
              <p class="text-[11px] text-amber-700">Precio actual: ${existing.precio_base ? fmtMoney(existing.precio_base) : "Sin precio"}</p>
              <div class="flex gap-2 pt-0.5">
                <button id="btn-auto-fill" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold shadow-xs">✨ Autocompletar datos</button>
                <button id="btn-auto-dismiss" class="px-2.5 py-1 bg-white border border-amber-300 text-amber-800 rounded-lg text-xs font-semibold">Continuar como nuevo</button>
              </div>
            `;
            avisoBox.querySelector("#btn-auto-fill").onclick = ()=>{
              $("#p-nombre").value = existing.nombre;
              if(existing.precio_base) $("#p-precio").value = existing.precio_base;
              if(existing.piezas_por_paquete) $("#p-ppp").value = existing.piezas_por_paquete;
              if(existing.foto_url){
                state.draft.fotoDataUrl = existing.foto_url;
                if(fotoBox) fotoBox.innerHTML = `<img src="${existing.foto_url}" class="w-full h-full object-cover"><span class="absolute inset-x-0 bottom-0 bg-black/60 text-white text-[8px] font-bold py-0.5 text-center">Toca p/ ver</span>`;
              }
              avisoBox.className = "hidden";
              updateDraft();
              calc();
              render();
              toast("Datos autocompletados desde el catálogo");
            };
            avisoBox.querySelector("#btn-auto-dismiss").onclick = ()=>{
              avisoBox.className = "hidden";
            };
          } else {
            avisoBox.className = "hidden";
            avisoBox.innerHTML = "";
          }
        };

        $("#p-codigo").addEventListener("input", ()=>{
          updateDraft();
          checkExistingCode();
        });
        $("#p-codigo").addEventListener("blur", checkExistingCode);

        const calc=()=>{
          const paq=+$("#p-paquetes").value||0;
          const ppp=+$("#p-ppp").value||0;
          const sue=+$("#p-sueltas").value||0;
          const total=paq*ppp+sue;
          $("#p-total").textContent=`${total} pz`;
          const dist={
            M:{paquetes:+$("#d-M-paq").value||0,piezas:+$("#d-M-pzs").value||0},
            C:{paquetes:+$("#d-C-paq").value||0,piezas:+$("#d-C-pzs").value||0},
            R:{paquetes:+$("#d-R-paq").value||0,piezas:+$("#d-R-pzs").value||0}
          };
          const distTotal=UBICACIONES.reduce((s,u)=>s+dist[u].paquetes*ppp+dist[u].piezas,0);
          const val=$("#d-validacion");
          if(distTotal>total){
            val.textContent=`⚠️ Supera total (${distTotal}/${total})`;
            val.className="text-[11px] font-bold text-red-600";
          } else if(distTotal===total&&total>0){
            val.textContent="✓ Distribución exacta";
            val.className="text-[11px] font-bold text-emerald-600";
          } else {
            val.textContent=`Falta distribuir (${distTotal}/${total})`;
            val.className="text-[11px] font-bold text-amber-600";
          }
          updateDraft();
          return {total,dist,ppp,paq,sue};
        };
        ["#p-paquetes","#p-ppp","#p-sueltas","#d-M-paq","#d-M-pzs","#d-C-paq","#d-C-pzs","#d-R-paq","#d-R-pzs"].forEach(s=>$(s)?.addEventListener("input",calc));

        // Manejo de fotos directo: botón cámara abre cámara en vivo / directa, opción archivo abre galería
        const camInp = $("#input-cam-direct");
        const fileInp = $("#input-file-direct");

        const applyPhotoBlob = async blob=>{
          if(!blob) return;
          fotoBlob = blob;
          const reader = new FileReader();
          reader.onload = e=>{
            state.draft.fotoDataUrl = e.target.result;
            saveDraft();
            render();
          };
          reader.readAsDataURL(blob);
        };

        const handleDirectFile = async file=>{
          if(!file) return;
          const blob = await procesarImagen(file);
          applyPhotoBlob(blob);
        };

        const triggerCameraAction = ()=>{
          openCameraDirectly(
            blob => applyPhotoBlob(blob),
            () => camInp.click()
          );
        };

        // Botón principal de Cámara (Directo sin menú selector)
        if($("#btn-cam-directo")) $("#btn-cam-directo").onclick = triggerCameraAction;

        // Botón de Galería / Archivo
        if($("#btn-foto-archivo")) $("#btn-foto-archivo").onclick = ()=>fileInp.click();

        // Tocar la vista previa de la foto
        if(fotoBox){
          fotoBox.onclick = ()=>{
            if(state.draft.fotoDataUrl){
              showImageModal(state.draft.fotoDataUrl, $("#p-nombre").value || "Foto del producto");
            } else {
              triggerCameraAction();
            }
          };
        }

        if($("#btn-ver-foto")){
          $("#btn-ver-foto").onclick = ()=>{
            if(state.draft.fotoDataUrl){
              showImageModal(state.draft.fotoDataUrl, $("#p-nombre").value || "Foto del producto");
            }
          };
        }

        if($("#btn-quitar-foto")){
          $("#btn-quitar-foto").onclick = ()=>{
            fotoBlob = null;
            state.draft.fotoDataUrl = null;
            saveDraft();
            render();
            toast("Foto eliminada");
          };
        }

        camInp.onchange = e => handleDirectFile(e.target.files[0]);
        fileInp.onchange = e => handleDirectFile(e.target.files[0]);

        // Voice dictation handlers
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        const dictar=(btn,handler)=>{
          $(btn).onclick=()=>{
            if(!SR){toast("Sin soporte de reconocimiento de voz en este navegador","err");return;}
            const r=new SR(); r.lang="es-MX";
            r.onresult=e=>handler(e.results[0][0].transcript);
            r.onerror=()=>{};
            r.start();
          };
        };

        dictar("#btn-dictar-nc",texto=>{
          const {nombre,codigo}=parseNombreCodigo(texto);
          $("#p-nombre").value=nombre;
          $("#p-codigo").value=codigo;
          updateDraft();
          checkExistingCode();
          toast(codigo?`Entendido: ${nombre} · ${codigo}`:`Entendido: ${nombre}`);
        });

        dictar("#btn-dictar-cant",texto=>{
          const res=parseCantidades(texto);
          if(res.ok){
            $("#p-paquetes").value=res.paquetes;
            $("#p-ppp").value=res.ppp;
            $("#p-sueltas").value=res.sueltas;
            calc();
            toast(`Cantidades: ${res.paquetes} pq × ${res.ppp} pz`+(res.sueltas?` + ${res.sueltas}`:""));
          } else toast("No se reconocieron cantidades","warn");
        });

        dictar("#btn-dictar-dist",texto=>{
          const {total}=calc();
          const res=parseDistribucion(texto,total);
          if(res.ok){
            UBICACIONES.forEach(u=>{
              $(`#d-${u}-paq`).value=res.distribucion[u].paquetes;
              $(`#d-${u}-pzs`).value=res.distribucion[u].piezas;
            });
            calc();
            toast(res.msg||"Distribución aplicada");
          } else toast("No se reconoció la distribución","warn");
        });

        // Guardar producto
        $("#btn-guardar").onclick=async()=>{
          const nombre=$("#p-nombre").value.trim();
          if(!nombre){toast("El nombre es obligatorio","err");return;}
          const {total,dist,ppp,paq,sue}=calc();

          const codigo=$("#p-codigo").value.trim().toUpperCase();
          const proveedor=$("#p-proveedor").value.trim();
          const nota=hoyNota();
          if(proveedor) await setConfig("last_proveedor",proveedor);

          let prod=null;
          if(codigo) prod=await db.productos.where("codigo").equals(codigo).first();
          if(!prod){
            const todos=await db.productos.toArray();
            prod=todos.find(p=>(p.nombre||"").toLowerCase()===nombre.toLowerCase());
          }

          const inputPrecio = $("#p-precio").value.trim();
          const precioNum = inputPrecio === "" ? null : +inputPrecio;

          if(!prod){
            prod={
              id:uid(), codigo:codigo||("P"+Date.now().toString().slice(-5)),
              nombre, estado:"activo", stock_total_bodega:total,
              piezas_por_paquete:ppp, precio_base:precioNum,
              foto_url: state.draft.fotoDataUrl || null,
              creado_en:new Date().toISOString(), synced:false
            };
          } else {
            prod.stock_total_bodega=(prod.stock_total_bodega||0)+total;
            if(inputPrecio !== "") prod.precio_base = precioNum;
            if(state.draft.fotoDataUrl && !prod.foto_url) prod.foto_url = state.draft.fotoDataUrl;
            prod.synced=false;
          }

          // Guardar de inmediato en base de datos local para asegurar persistencia
          await db.productos.put(prod);

          if(total > 0){
            const desglose=paq>0&&ppp>0
              ? (sue>0?`${paq} PQ CON ${ppp} PZ + ${sue} = ${total} PZ`:`${paq} PQ CON ${ppp} PZ = ${total} PZ`)
              : `${total} PZ`;

            const distTxt=UBICACIONES.map(u=>{
              const d=dist[u];
              const pz=d.paquetes*ppp+d.piezas;
              return pz>0?`${u}:${pz}`:null;
            }).filter(Boolean).join("  ");

            await db.compras.put({
              id:uid(), producto_id:prod.id, codigo:prod.codigo, nombre:prod.nombre,
              fecha:new Date().toISOString().slice(0,10), proveedor, nota,
              foto_url:prod.foto_url, paquetes:paq, piezas_por_paquete:ppp,
              piezas_sueltas:sue, total_piezas:total, desglose, dist_resumen:distTxt,
              creado_en:new Date().toISOString(), creado_por:state.user.id, synced:false
            });

            for(const u of UBICACIONES){
              const pz=dist[u].paquetes*ppp+dist[u].piezas;
              if(pz>0){
                await db.envios.put({
                  id:uid(), producto_id:prod.id, nombre:prod.nombre, codigo:prod.codigo,
                  foto_url:prod.foto_url, sucursal_destino:u,
                  total_enviado_piezas:pz, paquetes_enviados:dist[u].paquetes,
                  piezas_sueltas_enviadas:dist[u].piezas, estado:"ENVIADO",
                  fecha_envio:new Date().toISOString(), synced:false
                });
              }
            }
          }

          // Subida en segundo plano si hay blob
          if(fotoBlob){
            subirImagen(fotoBlob).then(async fUrl=>{
              if(fUrl){
                prod.foto_url = fUrl;
                await db.productos.put(prod);
                await syncAllToServer();
              }
            }).catch(()=>{});
          }

          await syncAllToServer();
          toast(total > 0 ? "Producto y compra guardados exitosamente" : "Producto guardado en catálogo");
          clearDraft();
          render();
        };

        async function cargarLista(){
          let compras = [];
          try {
            compras = (await db.compras.toArray()).sort((a,b)=>new Date(b.creado_en||0)-new Date(a.creado_en||0)).slice(0,40);
          } catch(e){}

          if(!compras.length){
            const prods = (await db.productos.toArray()).sort((a,b)=>new Date(b.creado_en||0)-new Date(a.creado_en||0)).slice(0,20);
            if(!prods.length){
              list.innerHTML=`<div class="bg-white rounded-2xl p-6 text-center text-xs text-slate-400">Sin registros recientes</div>`;
              return;
            }
            list.innerHTML=prods.map(p=>`
              <div class="bg-white rounded-2xl p-3 shadow-xs border border-slate-100 flex gap-3 items-center text-xs transition-all hover:border-slate-200 select-none" data-pid="${p.id}">
                <div class="img-rec-wrap w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center shrink-0 cursor-pointer overflow-hidden border border-slate-200/60 relative">
                  ${p.foto_url ? `<img src="${p.foto_url}" class="w-full h-full object-cover">` : `<span class="text-lg">📦</span>`}
                  ${!p.foto_url ? `<span class="absolute inset-0 bg-brand-600/80 text-white font-bold text-[9px] flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">+Foto</span>` : ""}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-1.5">
                    <p class="font-extrabold text-slate-800 text-sm truncate">${escapeHtml(p.nombre)}</p>
                    <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-bold">${escapeHtml(p.codigo||"—")}</span>
                  </div>
                  <p class="text-slate-500 text-[11px] mt-0.5">En catálogo · Stock: ${p.stock_total_bodega||0} pz</p>
                </div>
                <div class="text-right shrink-0 flex flex-col items-end gap-1">
                  <button class="btn-rec-precio font-black text-xs px-2.5 py-1 rounded-lg border transition-all ${p.precio_base ? "bg-brand-50 text-brand-700 border-brand-200 hover:bg-brand-100" : "bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100"}" data-pid="${p.id}">
                    ${p.precio_base ? fmtMoney(p.precio_base) : "+ Precio"}
                  </button>
                  <button class="btn-rec-menu text-slate-400 hover:text-slate-700 p-1 text-base leading-none" data-pid="${p.id}">•••</button>
                </div>
              </div>
            `).join("");
            setupRecListEvents();
            return;
          }

          const prodIds = compras.map(c=>c.producto_id);
          const prodsArr = await Promise.all(prodIds.map(pid=>db.productos.get(pid)));
          const prodsMap = {};
          prodsArr.forEach(p=>{ if(p) prodsMap[p.id]=p; });

          list.innerHTML=compras.map(c=>{
            const p = prodsMap[c.producto_id] || { id: c.producto_id, nombre: c.nombre, codigo: c.codigo, precio_base: null, foto_url: c.foto_url };
            const foto = p.foto_url || c.foto_url;
            return `
            <div class="bg-white rounded-2xl p-3 shadow-xs border border-slate-100 flex gap-3 items-center text-xs transition-all hover:border-slate-200 select-none" data-cid="${c.id}" data-pid="${p.id}">
              <div class="img-rec-wrap w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center shrink-0 cursor-pointer overflow-hidden border border-slate-200/60 relative">
                ${foto ? `<img src="${foto}" class="w-full h-full object-cover">` : `<span class="text-lg">📦</span>`}
                ${!foto ? `<span class="absolute inset-0 bg-brand-600/80 text-white font-bold text-[9px] flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity">+Foto</span>` : ""}
              </div>
              <div class="flex-1 min-w-0 info-rec-click cursor-pointer">
                <div class="flex items-center gap-1.5">
                  <p class="font-extrabold text-slate-800 text-sm truncate">${escapeHtml(c.nombre)}</p>
                  <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-bold">${escapeHtml(c.codigo||"—")}</span>
                </div>
                <p class="text-slate-500 text-[11px] mt-0.5">${c.desglose||c.total_piezas+" pz"}</p>
                ${c.dist_resumen ? `<p class="text-brand-600 font-bold text-[10px] mt-0.5">${c.dist_resumen}</p>` : ""}
              </div>
              <div class="text-right shrink-0 flex flex-col items-end gap-1">
                <button class="btn-rec-precio font-black text-xs px-2.5 py-1 rounded-lg border transition-all ${p.precio_base ? "bg-brand-50 text-brand-700 border-brand-200 hover:bg-brand-100" : "bg-amber-50 text-amber-700 border-amber-300 hover:bg-amber-100"}" data-pid="${p.id}">
                  ${p.precio_base ? fmtMoney(p.precio_base) : "+ Precio"}
                </button>
                <button class="btn-rec-menu text-slate-400 hover:text-slate-700 p-1 text-base leading-none" data-pid="${p.id}">•••</button>
              </div>
            </div>`;
          }).join("");
          setupRecListEvents();
        }

        function setupRecListEvents(){
          // Tap on image
          list.querySelectorAll(".img-rec-wrap").forEach(div=>{
            div.onclick = async e=>{
              e.stopPropagation();
              const row = div.closest("[data-pid]");
              const p = await db.productos.get(row.dataset.pid);
              if(!p) return;
              if(p.foto_url){
                showImageModal(p.foto_url, `${p.nombre} (${p.codigo})`);
              } else {
                promptPhotoCapture(async blob=>{
                  if(!blob) return;
                  const localUrl = URL.createObjectURL(blob);
                  p.foto_url = localUrl;
                  p.synced = false;
                  await db.productos.put(p);
                  await syncAllToServer();
                  toast("Foto añadida");
                  await cargarLista();
                  try {
                    const rUrl = await subirImagen(blob);
                    if(rUrl){ p.foto_url = rUrl; await db.productos.put(p); await syncAllToServer(); }
                  }catch(e){}
                });
              }
            };
          });

          // Tap on price directly opens numeric keypad modal
          list.querySelectorAll(".btn-rec-precio").forEach(btn=>{
            btn.onclick = async e=>{
              e.stopPropagation();
              const p = await db.productos.get(btn.dataset.pid);
              if(!p) return;
              showNumericPrompt(`Precio para ${p.codigo || p.nombre}:`, p.precio_base, async newVal=>{
                p.precio_base = newVal;
                p.synced = false;
                await db.productos.put(p);
                await syncAllToServer();
                toast("Precio actualizado");
                await cargarLista();
              });
            };
          });

          // Tap on menu or long press opens full product menu (delete, add photo, view, etc.)
          list.querySelectorAll(".btn-rec-menu").forEach(btn=>{
            btn.onclick = async e=>{
              e.stopPropagation();
              const p = await db.productos.get(btn.dataset.pid);
              if(!p) return;
              showProductMenu(p, ()=>cargarLista(), ()=>cargarLista());
            };
          });

          // Long press on row to open product menu
          list.querySelectorAll("[data-pid]").forEach(row=>{
            let pTimer = null;
            row.addEventListener("touchstart",()=>{
              pTimer = setTimeout(async ()=>{
                const p = await db.productos.get(row.dataset.pid);
                if(p) showProductMenu(p, ()=>cargarLista(), ()=>cargarLista());
              }, 600);
            });
            row.addEventListener("touchend",()=>clearTimeout(pTimer));
            row.addEventListener("touchmove",()=>clearTimeout(pTimer));
          });
        }

        await cargarLista();
        calc();
      },0);

      return wrap;
    }

    // ===================== PRECIOS =====================
    function renderConsultar(){
      const wrap=el("div",{class:"space-y-3 pb-8"});

      const headerBar = el("div",{class:"flex justify-between items-center"});
      headerBar.innerHTML = `
        <div>
          <h2 class="text-base font-extrabold text-slate-900 tracking-tight">Catálogo y Precios</h2>
          <p class="text-[11px] text-slate-500">Toca el precio para editar con teclado numérico</p>
        </div>
        <div class="flex items-center bg-slate-200/80 p-0.5 rounded-xl border border-slate-300/60 text-xs">
          <button id="view-grid-btn" class="px-2.5 py-1 rounded-lg font-bold transition-all ${state.preciosView==="grid"?"bg-white text-brand-700 shadow-xs":"text-slate-600"}">⊞ Cuadrícula</button>
          <button id="view-list-btn" class="px-2.5 py-1 rounded-lg font-bold transition-all ${state.preciosView==="list"?"bg-white text-brand-700 shadow-xs":"text-slate-600"}">☰ Lista</button>
        </div>
      `;
      wrap.appendChild(headerBar);

      const searchBox=el("div",{class:"relative"});
      searchBox.innerHTML=`
        <span class="absolute left-3.5 top-2.5 text-slate-400 text-sm">🔍</span>
        <input type="text" id="c-search" placeholder="Buscar por nombre o código..." class="w-full pl-9 pr-3.5 py-2 rounded-xl border border-slate-300 focus:border-brand-600 focus:ring-1 focus:ring-brand-600 text-sm font-medium outline-none bg-white shadow-2xs transition-all" />
      `;
      wrap.appendChild(searchBox);

      const countBar = el("div",{class:"flex justify-between items-center px-1 text-[11px]"});
      countBar.innerHTML = `
        <span id="c-count" class="font-bold text-slate-500">Cargando catálogo...</span>
        <button id="btn-precios-backup" class="text-brand-600 font-bold hover:underline flex items-center gap-1">
          <span>🔁</span><span>Importar de GitHub / Respaldo</span>
        </button>
      `;
      wrap.appendChild(countBar);

      const listContainer=el("div",{id:"c-container"});
      wrap.appendChild(listContainer);

      setTimeout(async()=>{
        const bkpBtn = $("#btn-precios-backup");
        if(bkpBtn) bkpBtn.onclick = ()=>showBackupModal();

        // 1. Sincronizar desde el servidor central para garantizar que todos los productos se muestran siempre
        try { await syncAllFromServer(); } catch(e){}

        // Sincronización y autoreparación del catálogo:
        // Aseguramos que cualquier producto que exista en compras pero no en productos sea recuperado
        const compras = await db.compras.toArray();
        const prodsExistentes = await db.productos.toArray();
        const prodKeys = new Set(prodsExistentes.map(p=>p.id));
        const codKeys = new Set(prodsExistentes.map(p=>p.codigo?.toUpperCase()).filter(Boolean));

        let recovered = 0;
        for(const c of compras){
          if((c.producto_id && !prodKeys.has(c.producto_id)) || (c.codigo && !codKeys.has(c.codigo.toUpperCase()))){
            const newP = {
              id: c.producto_id || uid(),
              codigo: c.codigo || ("P"+Date.now().toString().slice(-5)),
              nombre: c.nombre || "Producto sin nombre",
              estado: "activo",
              stock_total_bodega: c.total_piezas || 0,
              piezas_por_paquete: c.piezas_por_paquete || 0,
              precio_base: null,
              foto_url: c.foto_url || null,
              creado_en: c.creado_en || new Date().toISOString(),
              synced: false
            };
            await db.productos.put(newP);
            prodKeys.add(newP.id);
            if(newP.codigo) codKeys.add(newP.codigo.toUpperCase());
            recovered++;
          }
        }
        if(recovered > 0){
          try { await syncAllToServer(); } catch(e){}
        }

        let prods = (await db.productos.toArray()).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));

        // Setup view toggle buttons
        $("#view-grid-btn").onclick = ()=>{
          state.preciosView = "grid";
          localStorage.setItem("bodega_precios_view","grid");
          $("#view-grid-btn").className = "px-2.5 py-1 rounded-lg font-bold transition-all bg-white text-brand-700 shadow-xs";
          $("#view-list-btn").className = "px-2.5 py-1 rounded-lg font-bold transition-all text-slate-600";
          renderItems($("#c-search").value);
        };
        $("#view-list-btn").onclick = ()=>{
          state.preciosView = "list";
          localStorage.setItem("bodega_precios_view","list");
          $("#view-list-btn").className = "px-2.5 py-1 rounded-lg font-bold transition-all bg-white text-brand-700 shadow-xs";
          $("#view-grid-btn").className = "px-2.5 py-1 rounded-lg font-bold transition-all text-slate-600";
          renderItems($("#c-search").value);
        };

        const countBadge = $("#c-count");
        const renderItems = (q="")=>{
          const term = q.trim().toLowerCase();
          const filt = prods.filter(p=>{
            if(!term) return true;
            return (p.nombre||"").toLowerCase().includes(term) || (p.codigo||"").toLowerCase().includes(term);
          });

          if(countBadge) countBadge.textContent = `${filt.length} producto${filt.length===1?"":"s"} en catálogo`;

          if(!filt.length){
            listContainer.className = "";
            if(!prods.length){
              listContainer.innerHTML = `
                <div class="bg-white rounded-3xl p-6 text-center text-xs text-slate-500 border border-slate-200/80 shadow-xs space-y-3">
                  <div class="w-12 h-12 mx-auto rounded-2xl bg-brand-50 text-brand-600 flex items-center justify-center text-2xl">📦</div>
                  <div>
                    <h3 class="font-extrabold text-sm text-slate-800">Catálogo vacío en esta sesión</h3>
                    <p class="text-[11px] text-slate-500 mt-1 max-w-xs mx-auto leading-relaxed">
                      El navegador almacena los datos de GitHub bajo su propio dominio. Puedes importar tu catálogo de GitHub aquí en 1 segundo usando el Respaldo JSON:
                    </p>
                  </div>
                  <div class="flex flex-col sm:flex-row justify-center gap-2 pt-1 max-w-xs mx-auto">
                    <button id="btn-empty-import" class="w-full py-2.5 px-3 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white rounded-xl text-xs font-bold shadow-xs flex items-center justify-center gap-1.5 transition-all">
                      <span>📥</span><span>Cargar Respaldo JSON</span>
                    </button>
                    <button id="btn-empty-go-reg" class="w-full py-2.5 px-3 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all">
                      <span>➕</span><span>Registrar Producto</span>
                    </button>
                  </div>
                </div>`;
              const impBtn = listContainer.querySelector("#btn-empty-import");
              if(impBtn) impBtn.onclick = ()=>showBackupModal();
              const regBtn = listContainer.querySelector("#btn-empty-go-reg");
              if(regBtn) regBtn.onclick = ()=>{ state.view="registro"; render(); };
            } else {
              listContainer.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-400 border border-slate-100">No hay productos que coincidan con "${escapeHtml(q)}"</div>`;
            }
            return;
          }

          if(state.preciosView === "grid"){
            // Vista de cuadrícula de 2 columnas (o 3 en pantallas mayores)
            listContainer.className = "grid grid-cols-2 sm:grid-cols-3 gap-2.5";
            listContainer.innerHTML = filt.map(p=>{
              const precio = fmtMoney(p.precio_base);
              return `
              <div class="prod-card bg-white rounded-2xl p-2.5 shadow-xs border border-slate-200/80 flex flex-col justify-between hover:shadow-md transition-all select-none relative group" data-pid="${p.id}">
                <div class="space-y-2">
                  <div class="prod-img-box w-full h-28 rounded-xl bg-slate-100 flex items-center justify-center overflow-hidden cursor-pointer border border-slate-100 relative">
                    ${p.foto_url ? `<img src="${p.foto_url}" class="w-full h-full object-cover">` : `<span class="text-3xl">📦</span>`}
                    ${!p.foto_url ? `<span class="absolute bottom-1 right-1 bg-brand-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow-xs">+Foto</span>` : ""}
                  </div>
                  <div>
                    <p class="font-extrabold text-xs text-slate-900 line-clamp-2 leading-snug">${escapeHtml(p.nombre)}</p>
                    <span class="inline-block mt-1 text-[10px] bg-slate-100 text-slate-600 font-bold px-1.5 py-0.5 rounded">${escapeHtml(p.codigo||"—")}</span>
                  </div>
                </div>

                <div class="mt-3 pt-2 border-t border-slate-100 flex items-center justify-between gap-1">
                  <button class="prod-price-btn flex-1 py-1.5 px-2 rounded-xl text-center font-black text-xs transition-all ${precio ? "bg-brand-50 text-brand-700 hover:bg-brand-100 border border-brand-200" : "bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-300"}" data-pid="${p.id}">
                    ${precio || "+ Precio"}
                  </button>
                  <button class="prod-menu-btn text-slate-400 hover:text-slate-700 p-1 text-base leading-none font-bold" data-pid="${p.id}">•••</button>
                </div>
              </div>`;
            }).join("");
          } else {
            // Vista de lista horizontal
            listContainer.className = "space-y-2";
            listContainer.innerHTML = filt.map(p=>{
              const precio = fmtMoney(p.precio_base);
              return `
              <div class="prod-card bg-white rounded-2xl p-2.5 shadow-xs border border-slate-200/80 flex gap-2.5 items-center hover:shadow-md transition-all select-none" data-pid="${p.id}">
                <div class="prod-img-box w-12 h-12 rounded-xl bg-slate-100 shrink-0 flex items-center justify-center overflow-hidden cursor-pointer border border-slate-100 relative">
                  ${p.foto_url ? `<img src="${p.foto_url}" class="w-full h-full object-cover">` : `<span class="text-xl">📦</span>`}
                </div>
                <div class="flex-1 min-w-0">
                  <p class="font-extrabold text-xs sm:text-sm text-slate-900 truncate">${escapeHtml(p.nombre)}</p>
                  <div class="flex items-center gap-1.5 mt-0.5">
                    <span class="text-[10px] bg-slate-100 text-slate-600 font-bold px-1.5 py-0.5 rounded">${escapeHtml(p.codigo||"—")}</span>
                    ${p.stock_total_bodega ? `<span class="text-[10px] text-slate-400">Stock: ${p.stock_total_bodega} pz</span>` : ""}
                  </div>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button class="prod-price-btn py-1.5 px-3 rounded-xl font-black text-xs transition-all ${precio ? "bg-brand-50 text-brand-700 hover:bg-brand-100 border border-brand-200" : "bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-300"}" data-pid="${p.id}">
                    ${precio || "+ Precio"}
                  </button>
                  <button class="prod-menu-btn text-slate-400 hover:text-slate-700 p-1 text-base leading-none font-bold" data-pid="${p.id}">•••</button>
                </div>
              </div>`;
            }).join("");
          }

          // Handlers for list / grid elements
          listContainer.querySelectorAll(".prod-img-box").forEach(box=>{
            box.onclick = async e=>{
              e.stopPropagation();
              const card = box.closest("[data-pid]");
              const p = prods.find(item=>item.id === card.dataset.pid);
              if(!p) return;
              if(p.foto_url){
                showImageModal(p.foto_url, `${p.nombre} (${p.codigo})`);
              } else {
                promptPhotoCapture(async blob=>{
                  if(!blob) return;
                  const localUrl = URL.createObjectURL(blob);
                  p.foto_url = localUrl;
                  p.synced = false;
                  await db.productos.put(p);
                  await syncAllToServer();
                  toast("Foto asignada");
                  renderItems($("#c-search").value);
                  try {
                    const rUrl = await subirImagen(blob);
                    if(rUrl){ p.foto_url = rUrl; await db.productos.put(p); await syncAllToServer(); }
                  }catch(e){}
                });
              }
            };
          });

          // Tap on price directly triggers quick numeric keyboard modal
          listContainer.querySelectorAll(".prod-price-btn").forEach(btn=>{
            btn.onclick = async e=>{
              e.stopPropagation();
              const p = prods.find(item=>item.id === btn.dataset.pid);
              if(!p) return;
              showNumericPrompt(`Precio para ${p.codigo || p.nombre}:`, p.precio_base, async newVal=>{
                p.precio_base = newVal;
                p.synced = false;
                await db.productos.put(p);
                await syncAllToServer();
                toast("Precio actualizado");
                renderItems($("#c-search").value);
              });
            };
          });

          // Menu button triggers options (Delete with "ADMIN: ¿Confirma eliminar X?", Change Photo, View Photo)
          listContainer.querySelectorAll(".prod-menu-btn").forEach(btn=>{
            btn.onclick = async e=>{
              e.stopPropagation();
              const p = prods.find(item=>item.id === btn.dataset.pid);
              if(!p) return;
              showProductMenu(p, async ()=>{
                prods = await db.productos.orderBy("nombre").toArray();
                renderItems($("#c-search").value);
              }, async ()=>{
                prods = await db.productos.orderBy("nombre").toArray();
                renderItems($("#c-search").value);
              });
            };
          });

          // Long press on whole card triggers menu
          listContainer.querySelectorAll(".prod-card").forEach(card=>{
            let cTimer = null;
            card.addEventListener("touchstart",()=>{
              cTimer = setTimeout(()=>{
                const p = prods.find(item=>item.id === card.dataset.pid);
                if(p){
                  showProductMenu(p, async ()=>{
                    prods = await db.productos.orderBy("nombre").toArray();
                    renderItems($("#c-search").value);
                  }, async ()=>{
                    prods = await db.productos.orderBy("nombre").toArray();
                    renderItems($("#c-search").value);
                  });
                }
              }, 600);
            });
            card.addEventListener("touchend",()=>clearTimeout(cTimer));
            card.addEventListener("touchmove",()=>clearTimeout(cTimer));
          });
        };

        renderItems();
        $("#c-search").oninput = e => renderItems(e.target.value);
      },0);

      return wrap;
    }

    // ===================== RECIBIR =====================
    function renderRecibir(){
      const wrap=el("div",{class:"space-y-2"});
      wrap.appendChild(el("h2",{class:"text-base font-bold text-brand-900"},"Reportar lo recibido"));
      wrap.appendChild(el("p",{class:"text-xs text-slate-500"},"Indica solo lo que te llegó. No ves la distribución."));

      const firmaBox=el("div",{class:"bg-brand-50 rounded-xl p-2.5 flex gap-2 items-center"});
      firmaBox.innerHTML=`
        <input id="firma" class="flex-1 px-3 py-2 rounded-lg border text-sm font-semibold uppercase outline-none" placeholder="Tu nombre" />
        <button id="btn-confirmar" class="px-3 py-2 bg-brand-600 text-white rounded-lg text-xs font-bold">Confirmar</button>
      `;
      wrap.appendChild(firmaBox);
      const list=el("div",{id:"rec-list",class:"space-y-1.5"});
      wrap.appendChild(list);

      setTimeout(async()=>{
        const compras=await db.compras.orderBy("creado_en").reverse().limit(40).toArray();
        const vistos=new Set();
        const items=[];
        for(const c of compras){
          const k=c.producto_id||c.nombre;
          if(vistos.has(k)) continue;
          vistos.add(k);
          items.push(c);
        }
        if(!items.length){
          list.innerHTML=`<p class="text-xs text-slate-400 text-center py-8">No hay productos</p>`;
          return;
        }
        list.innerHTML=items.map(c=>`
          <div class="bg-white rounded-xl p-2.5 shadow-sm flex gap-2 items-center" data-id="${c.producto_id||c.id}" data-nombre="${escapeHtml(c.nombre)}" data-codigo="${escapeHtml(c.codigo||"")}">
            ${c.foto_url?`<img src="${c.foto_url}" class="w-12 h-12 rounded-lg object-cover">`:`<div class="w-12 h-12 rounded-lg bg-slate-100 flex items-center justify-center">📦</div>`}
            <div class="flex-1 min-w-0">
              <p class="font-semibold text-sm truncate">${escapeHtml(c.nombre)}</p>
              <p class="text-[10px] text-slate-500">${escapeHtml(c.codigo||"")}</p>
            </div>
            <input type="number" min="0" value="0" inputmode="numeric" class="rec-qty w-16 px-2 py-1.5 rounded-lg border text-center text-sm font-bold" />
          </div>
        `).join("");

        list.querySelectorAll(".rec-qty").forEach(inp=>{
          inp.addEventListener("focus",()=>{if(inp.value==="0")inp.value="";});
          inp.addEventListener("blur",()=>{if(inp.value==="")inp.value="0";});
        });

        $("#btn-confirmar").onclick=async()=>{
          const firma=$("#firma").value.trim().toUpperCase();
          if(!firma){toast("Escribe tu nombre","err");return;}
          let n=0;
          for(const row of list.querySelectorAll("[data-id]")){
            const qty=+(row.querySelector(".rec-qty").value)||0;
            if(qty<=0) continue;
            await db.recepciones.put({
              id:uid(), producto_id:row.dataset.id, codigo:row.dataset.codigo,
              nombre:row.dataset.nombre, usuario_id:state.user.id,
              cantidad_recibida:qty, firma, fecha:new Date().toISOString().slice(0,10),
              creado_en:new Date().toISOString(), synced:false
            });
            n++;
          }
          if(!n){toast("No indicaste cantidades","warn");return;}
          await syncAllToServer();
          toast(`Registrado ${n} producto(s)`);
          render();
        };
      },0);
      return wrap;
    }

    // ===================== REPORTES =====================
    function renderReportes(){
      const wrap=el("div",{class:"space-y-3 pb-8"});
      wrap.appendChild(el("h2",{class:"text-base font-extrabold text-slate-900 tracking-tight"},"Reportes"));

      const tabs=el("div",{class:"grid grid-cols-4 gap-1 pb-1"});
      [
        ["compra","Compra","📦"],
        ["traslado","Traslado","🚚"],
        ["recepciones","Recepción","📥"],
        ["diferencias","Diferencias","⚖️"]
      ].forEach(([t,label,icon])=>{
        const active = (state.rtab||"compra") === t;
        tabs.appendChild(el("button",{
          class:`py-2 px-0.5 rounded-xl font-black flex flex-col items-center justify-center gap-0.5 shrink-0 transition-all ${active?"bg-brand-600 text-white shadow-xs":"bg-white border border-slate-200 text-slate-700 hover:bg-slate-50"}`,
          onclick:()=>{state.rtab=t;render();}
        },
          el("span",{class:"text-base"},icon),
          el("span",{class:"text-[10px] leading-tight font-extrabold tracking-tight"},label)
        ));
      });
      wrap.appendChild(tabs);
      const body=el("div",{id:"rep-body",class:"space-y-2.5"});
      wrap.appendChild(body);

      setTimeout(async()=>{
        const tab=state.rtab||"compra";
        if(tab==="compra"){
          const compras=await db.compras.orderBy("creado_en").reverse().toArray();
          const porNota={};
          compras.forEach(c=>{
            const k=c.nota||"SIN-NOTA";
            if(!porNota[k]) porNota[k]={nota:k,proveedor:c.proveedor,fecha:c.fecha,items:[]};
            porNota[k].items.push(c);
          });
          const comprasArr = Object.values(porNota);
          body.innerHTML=comprasArr.length ? comprasArr.map(g=>`
            <div class="bg-white rounded-2xl p-3.5 shadow-xs border border-slate-200/80 space-y-2.5">
              <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <div>
                  <p class="font-black text-sm text-slate-900">COMPRA: ${escapeHtml(g.nota)}</p>
                  <p class="text-[11px] text-slate-500 font-medium">Proveedor: <b>${escapeHtml(g.proveedor||"—")}</b> · ${g.fecha}</p>
                </div>
                <!-- UN solo botón de PDF para toda la compra -->
                <button data-nota="${g.nota}" class="btn-pdf-compra px-3 py-1.5 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs transition-all">
                  <span>📄</span><span>PDF Compra</span>
                </button>
              </div>
              <div class="space-y-2">
                ${g.items.map(c=>`
                  <div class="flex gap-2.5 items-center text-xs">
                    <div class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center shrink-0 overflow-hidden border border-slate-100">
                      ${c.foto_url?`<img src="${c.foto_url}" class="w-full h-full object-cover">`:`<span>📦</span>`}
                    </div>
                    <div class="flex-1 min-w-0">
                      <p class="font-extrabold text-slate-800 truncate">${escapeHtml(c.nombre)}</p>
                      <p class="text-slate-500 text-[11px]">${c.desglose||c.total_piezas+" pz"}</p>
                      ${c.dist_resumen?`<p class="text-brand-600 font-bold text-[10px]">${c.dist_resumen}</p>`:""}
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>
          `).join("") : `<div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-400 border border-slate-100">No hay compras registradas</div>`;

          body.querySelectorAll(".btn-pdf-compra").forEach(btn=>{
            btn.onclick=()=>generarPDFCompra(btn.dataset.nota,porNota[btn.dataset.nota]);
          });
        }
        else if(tab==="traslado"){
          const envios=await db.envios.where("estado").equals("ENVIADO").toArray();
          const porProd={};
          envios.forEach(e=>{
            const k=e.producto_id||e.nombre;
            if(!porProd[k]) porProd[k]={nombre:e.nombre,codigo:e.codigo,foto_url:e.foto_url,dist:[]};
            porProd[k].dist.push(`${e.sucursal_destino}: ${e.total_enviado_piezas} pz`);
          });
          const items=Object.values(porProd);
          body.innerHTML=`
            ${items.length?`
              <div class="flex justify-between items-center mb-1">
                <span class="text-xs font-bold text-slate-600">${items.length} producto(s) en traslado</span>
                <button id="btn-pdf-traslado" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs">
                  <span>📄</span><span>Generar Hoja de Traslado (PDF)</span>
                </button>
              </div>`:""}
            ${items.length?items.map(p=>`
              <div class="bg-white rounded-2xl p-3 shadow-xs border border-slate-200/80 flex gap-2.5 items-center text-xs">
                <div class="w-11 h-11 rounded-lg bg-slate-100 shrink-0 overflow-hidden flex items-center justify-center">
                  ${p.foto_url?`<img src="${p.foto_url}" class="w-full h-full object-cover">`:`<span>📦</span>`}
                </div>
                <div class="flex-1 min-w-0">
                  <p class="font-extrabold text-sm text-slate-800 truncate">${escapeHtml(p.nombre)}</p>
                  <p class="text-brand-700 font-bold text-xs mt-0.5">${p.dist.join("  ·  ")}</p>
                </div>
              </div>
            `).join(""):`<div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-400 border border-slate-100">No hay traslados en tránsito</div>`}
          `;
          const btn=$("#btn-pdf-traslado");
          if(btn) btn.onclick=()=>generarPDFTraslado(items);
        }
        else if(tab==="recepciones"){
          const recepciones=await db.recepciones.toArray();
          const compras=await db.compras.toArray();
          const envios=await db.envios.toArray();

          const totalComprado={};
          compras.forEach(c=>{
            const k=c.producto_id||c.nombre;
            totalComprado[k]=(totalComprado[k]||0)+(c.total_piezas||0);
          });

          const porProd={};
          recepciones.forEach(r=>{
            const k=r.producto_id||r.nombre;
            if(!porProd[k]) porProd[k]={nombre:r.nombre,totalReportado:0,reportes:[]};
            porProd[k].reportes.push(r);
            porProd[k].totalReportado+=r.cantidad_recibida;
          });

          const keys=Object.keys(porProd);
          body.innerHTML=keys.length ? keys.map(k=>{
            const p = porProd[k];
            const comprado=totalComprado[k]||0;
            const sobre=p.totalReportado>comprado;
            return `
              <div class="bg-white rounded-2xl p-3.5 shadow-xs border ${sobre?"border-2 border-red-500 bg-red-50/20":"border-slate-200/80"} space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <p class="font-extrabold text-sm text-slate-900">${escapeHtml(p.nombre)}</p>
                    <p class="text-xs text-slate-500 mt-0.5">Comprado: <b>${comprado} pz</b> · Total reportado recibido: <b>${p.totalReportado} pz</b></p>
                  </div>
                  ${sobre ? `<span class="px-2 py-0.5 rounded-full bg-red-600 text-white font-black text-[10px] tracking-wide animate-pulse">¡SOBRE-INFORME!</span>` : ""}
                </div>

                <div class="pt-2 border-t border-slate-100 space-y-1.5">
                  <p class="text-[11px] font-bold text-slate-600 uppercase tracking-wider">Detalle por sucursal / usuario:</p>
                  ${p.reportes.map(r=>{
                    return `
                    <div class="bg-slate-50 rounded-xl p-2 text-xs flex justify-between items-center border border-slate-200/70">
                      <div>
                        <span class="font-extrabold text-brand-800">Usuario ${escapeHtml(r.usuario_id)}</span>
                        ${r.firma ? `<span class="text-slate-600 font-semibold"> (Firmó: ${escapeHtml(r.firma)})</span>` : ""}
                        <p class="text-[10px] text-slate-400">${r.fecha}</p>
                      </div>
                      <span class="font-black text-xs text-slate-800 bg-white px-2 py-1 rounded-lg border border-slate-200">${r.cantidad_recibida} pz</span>
                    </div>`;
                  }).join("")}
                </div>
              </div>`;
          }).join("") : `<div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-400 border border-slate-100">Sin recepciones reportadas</div>`;
        }
        else if(tab==="diferencias"){
          // Reporte consolidado de diferencias (Enviado vs Recibido por cada sucursal)
          const envios = await db.envios.toArray();
          const recepciones = await db.recepciones.toArray();

          const porItem = {};
          envios.forEach(e=>{
            const key = e.producto_id || e.nombre;
            if(!porItem[key]) porItem[key] = { nombre: e.nombre, codigo: e.codigo, enviado: {M:0,C:0,R:0}, recibido: {M:0,C:0,R:0} };
            const u = (e.sucursal_destino||"").toUpperCase();
            if(porItem[key].enviado[u] !== undefined){
              porItem[key].enviado[u] += (e.total_enviado_piezas || 0);
            }
          });

          recepciones.forEach(r=>{
            const key = r.producto_id || r.nombre;
            if(!porItem[key]) porItem[key] = { nombre: r.nombre, codigo: r.codigo, enviado: {M:0,C:0,R:0}, recibido: {M:0,C:0,R:0} };
            // Identificar sucursal por usuario_id (ej. M1 -> M, C2 -> C, R1 -> R)
            let u = (r.usuario_id||"").charAt(0).toUpperCase();
            if(!porItem[key].recibido[u]) u = "M"; // default fallback
            porItem[key].recibido[u] += (r.cantidad_recibida || 0);
          });

          const diffList = Object.values(porItem);

          body.innerHTML = `
            ${diffList.length ? `
            <div class="flex justify-between items-center mb-1">
              <span class="text-xs font-bold text-slate-600">Balance de Sucursales</span>
              <button id="btn-pdf-diferencias" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-xs">
                <span>📄</span><span>PDF Diferencias</span>
              </button>
            </div>` : ""}
            ${diffList.length ? diffList.map(item=>{
              return `
              <div class="bg-white rounded-2xl p-3.5 shadow-xs border border-slate-200/80 space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <p class="font-extrabold text-sm text-slate-900">${escapeHtml(item.nombre)}</p>
                    <span class="text-[10px] bg-slate-100 text-slate-600 font-bold px-1.5 py-0.5 rounded">${escapeHtml(item.codigo||"—")}</span>
                  </div>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-1">
                  ${["M","C","R"].map(u=>{
                    const env = item.enviado[u] || 0;
                    const rec = item.recibido[u] || 0;
                    const diff = rec - env;
                    const statusClass = diff === 0 
                      ? (env > 0 ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-slate-50 border-slate-200 text-slate-500")
                      : (diff < 0 ? "bg-red-50 border-red-200 text-red-800" : "bg-amber-50 border-amber-200 text-amber-800");

                    const diffTxt = diff === 0 
                      ? (env > 0 ? "✓ Cuadrado" : "0 pz")
                      : (diff < 0 ? `Faltan ${Math.abs(diff)} pz` : `Sobran +${diff} pz`);

                    return `
                    <div class="rounded-xl p-2 border ${statusClass} text-center space-y-0.5">
                      <div class="font-black text-xs">${u === "M" ? "Misaki" : u === "C" ? "Chilte" : "Rdgz"}</div>
                      <div class="text-[10px]">Env: <b>${env}</b> | Rec: <b>${rec}</b></div>
                      <div class="text-[10px] font-black">${diffTxt}</div>
                    </div>`;
                  }).join("")}
                </div>
              </div>`;
            }).join("") : `<div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-400 border border-slate-100">Sin diferencias registradas</div>`}
          `;

          const pdfBtn = $("#btn-pdf-diferencias");
          if(pdfBtn) pdfBtn.onclick = ()=>generarPDFDiferencias(diffList);
        }
      },0);

      return wrap;
    }

    function imprimirDocumento(htmlContent){
      let w = null;
      try {
        w = window.open("","_blank");
      } catch(e){}
      if(w){
        w.document.write(htmlContent);
        w.document.close();
      } else {
        let frame = document.getElementById("print-fallback-frame");
        if(!frame){
          frame = document.createElement("iframe");
          frame.id = "print-fallback-frame";
          frame.style.position = "fixed";
          frame.style.right = "-9999px";
          frame.style.bottom = "-9999px";
          frame.style.width = "0";
          frame.style.height = "0";
          frame.style.border = "none";
          document.body.appendChild(frame);
        }
        const doc = frame.contentWindow.document;
        doc.open();
        doc.write(htmlContent);
        doc.close();
      }
    }

    function generarPDFCompra(nota,grupo){
      const filas=grupo.items.map(c=>`
        <tr>
          <td style="padding:10px;border-bottom:1px solid #e2e8f0;width:55px;">${c.foto_url?`<img src="${c.foto_url}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;">`:"📦"}</td>
          <td style="padding:10px;border-bottom:1px solid #e2e8f0;"><b>${escapeHtml(c.nombre)}</b><br><span style="color:#64748b;font-size:12px;">Código: ${escapeHtml(c.codigo)}</span></td>
          <td style="padding:10px;border-bottom:1px solid #e2e8f0;font-size:13px;text-align:right;"><b>${escapeHtml(c.desglose||c.total_piezas+" pz")}</b></td>
        </tr>`).join("");
      const html = `<!DOCTYPE html><html><head><title>COMPRA ${nota}</title>
        <style>body{font-family:Arial,sans-serif;padding:30px;color:#0f172a;}h1{font-size:22px;margin:0 0 4px;font-weight:900;}.meta{color:#64748b;font-size:13px;margin-bottom:24px;border-bottom:1px solid #e2e8f0;padding-bottom:10px;}table{width:100%;border-collapse:collapse;}th{text-align:left;padding:10px;border-bottom:2px solid #0f172a;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;}</style></head><body>
        <h1>COMPRA ${escapeHtml(nota)}</h1>
        <div class="meta">Proveedor: <b>${escapeHtml(grupo.proveedor||"—")}</b> &nbsp;·&nbsp; Fecha: <b>${grupo.fecha}</b></div>
        <table><thead><tr><th>Foto</th><th>Producto</th><th style="text-align:right;">Cantidad Total</th></tr></thead><tbody>${filas}</tbody></table>
        <script>setTimeout(()=>window.print(),400);<\/script></body></html>`;
      imprimirDocumento(html);
    }

    function generarPDFTraslado(items){
      const filas=items.map(p=>`
        <tr>
          <td style="padding:10px;border-bottom:1px solid #e2e8f0;width:55px;">${p.foto_url?`<img src="${p.foto_url}" style="width:48px;height:48px;object-fit:cover;border-radius:8px;">`:"📦"}</td>
          <td style="padding:10px;border-bottom:1px solid #e2e8f0;"><b>${escapeHtml(p.nombre)}</b><br><span style="color:#64748b;font-size:12px;">Código: ${escapeHtml(p.codigo||"—")}</span></td>
          <td style="padding:10px;border-bottom:1px solid #e2e8f0;font-size:13px;font-weight:bold;color:#1e40af;">${p.dist.join(" &nbsp;·&nbsp; ")}</td>
        </tr>`).join("");
      const html = `<!DOCTYPE html><html><head><title>HOJA DE TRASLADO</title>
        <style>body{font-family:Arial,sans-serif;padding:30px;color:#0f172a;}h1{font-size:22px;margin:0 0 4px;font-weight:900;}.meta{color:#64748b;font-size:13px;margin-bottom:24px;border-bottom:1px solid #e2e8f0;padding-bottom:10px;}table{width:100%;border-collapse:collapse;}th{text-align:left;padding:10px;border-bottom:2px solid #0f172a;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;}</style></head><body>
        <h1>HOJA DE TRASLADO A SUCURSALES</h1>
        <div class="meta">Fecha de emisión: <b>${new Date().toLocaleDateString("es-MX")}</b></div>
        <table><thead><tr><th>Foto</th><th>Producto</th><th>Distribución Asignada</th></tr></thead><tbody>${filas}</tbody></table>
        <script>setTimeout(()=>window.print(),400);<\/script></body></html>`;
      imprimirDocumento(html);
    }

    function generarPDFDiferencias(diffList){
      const filas = diffList.map(item=>`
        <tr>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;"><b>${escapeHtml(item.nombre)}</b><br><span style="color:#64748b;font-size:11px;">${escapeHtml(item.codigo||"—")}</span></td>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;text-align:center;">Env: ${item.enviado.M}<br>Rec: ${item.recibido.M}<br><b>${item.recibido.M - item.enviado.M}</b></td>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;text-align:center;">Env: ${item.enviado.C}<br>Rec: ${item.recibido.C}<br><b>${item.recibido.C - item.enviado.C}</b></td>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;text-align:center;">Env: ${item.enviado.R}<br>Rec: ${item.recibido.R}<br><b>${item.recibido.R - item.enviado.R}</b></td>
        </tr>
      `).join("");

      const html = `<!DOCTYPE html><html><head><title>REPORTE DE DIFERENCIAS</title>
        <style>body{font-family:Arial,sans-serif;padding:30px;color:#0f172a;}h1{font-size:22px;margin:0 0 4px;font-weight:900;}.meta{color:#64748b;font-size:13px;margin-bottom:20px;border-bottom:1px solid #e2e8f0;padding-bottom:10px;}table{width:100%;border-collapse:collapse;}th{text-align:center;padding:8px;border-bottom:2px solid #0f172a;font-size:12px;}th:first-child{text-align:left;}</style></head><body>
        <h1>REPORTE DE DIFERENCIAS (ENVIADO VS RECIBIDO)</h1>
        <div class="meta">Fecha de cálculo: <b>${new Date().toLocaleDateString("es-MX")}</b></div>
        <table><thead><tr><th>Producto</th><th>Misaki (M)</th><th>Chiltepec (C)</th><th>Rodríguez (R)</th></tr></thead><tbody>${filas}</tbody></table>
        <script>setTimeout(()=>window.print(),400);<\/script></body></html>`;
      imprimirDocumento(html);
    }

    function renderConfig(){
      const wrap=el("div",{class:"space-y-3 pb-8"});
      wrap.appendChild(el("h2",{class:"text-base font-extrabold text-slate-900 tracking-tight"},"Gestión de Usuarios y Accesos"));
      const list=el("div",{id:"user-list",class:"space-y-2"});
      wrap.appendChild(list);
      const form=el("div",{class:"bg-white rounded-2xl p-4 shadow-xs border border-slate-200/80 space-y-3"});
      form.innerHTML=`
        <p class="text-xs font-bold text-slate-700 uppercase tracking-wider">Agregar o Actualizar PIN</p>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Usuario / Código</label>
            <input id="nu-id" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold text-sm uppercase outline-none" placeholder="Ej. M4" />
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-500 mb-0.5">PIN (4 dígitos)</label>
            <input id="nu-pin" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-bold text-center outline-none" placeholder="••••" maxlength="4" inputmode="numeric" />
          </div>
        </div>
        <div>
          <label class="block text-[10px] font-bold text-slate-500 mb-0.5">Rol de cuenta</label>
          <select id="nu-rol" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-semibold outline-none bg-white">
            <option value="sucursal">Sucursal (Solo Consulta y Recibir)</option>
            <option value="admin">Administrador (Acceso Total)</option>
          </select>
        </div>
        <button id="nu-save" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl text-xs font-bold shadow-xs">Guardar Usuario / PIN</button>
      `;
      wrap.appendChild(form);
      setTimeout(async()=>{
        async function cargarUsers(){
          const users=await db.usuarios.toArray();
          list.innerHTML=users.map(u=>`
            <div class="bg-white rounded-2xl p-3 shadow-xs border border-slate-200/80 flex justify-between items-center text-sm">
              <div class="flex items-center gap-2.5">
                <span class="w-8 h-8 rounded-lg bg-brand-50 text-brand-700 font-black text-xs flex items-center justify-center">${u.rol==="admin"?"👑":"📍"}</span>
                <div>
                  <p class="font-extrabold text-slate-800 text-xs sm:text-sm">${escapeHtml(u.id)} ${u.id===state.user.id?"<span class=\"text-[10px] font-bold bg-brand-100 text-brand-700 px-1.5 py-0.5 rounded ml-1\">Tú</span>":""}</p>
                  <p class="text-[10px] text-slate-500 uppercase font-semibold">${u.rol}</p>
                </div>
              </div>
              ${u.id!==state.user.id?`<button data-id="${u.id}" class="del-user text-xs text-red-600 hover:text-red-700 font-bold px-2 py-1 rounded-lg hover:bg-red-50">Eliminar</button>`:""}
            </div>
          `).join("");
          list.querySelectorAll(".del-user").forEach(btn=>{
            btn.onclick=()=>{
              showAdminConfirm(`ADMIN: ¿Confirma eliminar usuario ${btn.dataset.id}?`, "El usuario ya no podrá iniciar sesión en la aplicación.", async ()=>{
                await db.usuarios.delete(btn.dataset.id);
                toast("Usuario eliminado");
                cargarUsers();
              });
            };
          });
        }
        cargarUsers();
        $("#nu-save").onclick=async()=>{
          const id=$("#nu-id").value.trim().toUpperCase();
          const pin=$("#nu-pin").value.trim();
          const rol=$("#nu-rol").value;
          if(!id||!/^\d{4}$/.test(pin)){toast("Indica código y un PIN numérico de 4 dígitos","err");return;}
          const existe=await db.usuarios.get(id);
          if(existe){existe.pin=pin;existe.rol=rol;existe.synced=false;await db.usuarios.put(existe);toast("PIN actualizado");}
          else{await db.usuarios.put({id,pin,rol,synced:false});toast("Usuario creado");}
          $("#nu-id").value="";$("#nu-pin").value="";
          cargarUsers();
        };
      },0);
      return wrap;
    }

    async function init(){
      await seed();
      try {
        await syncAllFromServer();
        await syncAllToServer();
      } catch(e){}
      window.addEventListener("online",async ()=>{
        state.online=true;
        await syncAllFromServer();
        render();
      });
      window.addEventListener("offline",()=>{state.online=false;});
      render();
    }
    init();
  </script>
</body>
</html>
