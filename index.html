  <script type="module">
    // ===================== CONFIG =====================
    const SUPABASE_URL = "https://ycbuzyczxrbclckabkow.supabase.co";

    const STORAGE_BUCKET = "productos";

    const ALIAS = {m:"M",misaki:"M",isla:"M",eme:"M",c:"C",chiltepec:"C",chilte:"C",r:"R",rodriguez:"R","rodríguez":"R"};

    const SINONIMOS = {

    // ===================== UTILS =====================
    const $ = (s,r=document)=>r.querySelector(s);
    const el = (tag, props={}, ...kids)=>{
      const n=document.createElement(tag);
      Object.entries(props).forEach(([k,v])=>{
        if(k==="class") n.className=v;
        else if(k==="html") n.innerHTML=v;
        else if(k.startsWith("on")&&typeof v==="function") n.addEventListener(k.slice(2).toLowerCase(),v);
        else n.setAttribute(k,v);
      });
      kids.flat().forEach(c=>{ if(c!=null&&c!==false) n.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c); });
      return n;
    };
    const uid = ()=>crypto.randomUUID?.()||("id-"+Date.now());
    const escapeHtml = s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const hoyNota = ()=>{
      const d=new Date();
      return "P"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");

    function toast(msg,type="ok"){
      state.toast={msg,type};
      renderToast();
      setTimeout(()=>{state.toast=null;renderToast();},2500);

    function renderToast(){
      let t=$("#toast");
      if(!state.toast){if(t)t.remove();return;}
      if(!t){t=el("div",{id:"toast",class:"fixed bottom-16 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 rounded-xl shadow-lg text-white text-sm font-medium max-w-[90%] text-center"});document.body.appendChild(t);}
      t.className="fixed bottom-16 left-1/2 -translate-x-1/2 z-[100] px-4 py-2.5 rounded-xl shadow-lg text-white text-sm font-medium max-w-[90%] text-center "+(state.toast.type==="ok"?"bg-emerald-600":state.toast.type==="warn"?"bg-amber-500":"bg-red-600");
      t.textContent=state.toast.msg;
    }

    // ===================== VOZ =====================
    const WORD_NUMS={cero:0,uno:1,una:1,un:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,mil:1000};
    function wordsToNumber(t){t=(t||"").toLowerCase().trim();if(/^\d+$/.test(t))return parseInt(t,10);return WORD_NUMS[t]??null;}

    function parseCantidades(text){
      const norm=text.toLowerCase().replace(/[áéíóú]/g,c=>({á:"a",é:"e",í:"i",ó:"o",ú:"u"}[c]));
      let paquetes=0,ppp=0,sueltas=0,cajas=0,paqPorCaja=0;

      // 2 cajas con 24 paquetes de 10
      const cajaMatch=norm.match(/(\d+|\w+)\s*cajas?\s*(?:con|de)?\s*(\d+|\w+)\s*(?:paquetes?|bolsas?)/);
      if(cajaMatch){cajas=wordsToNumber(cajaMatch[1])||0;paqPorCaja=wordsToNumber(cajaMatch[2])||0;paquetes=cajas*paqPorCaja;}

      const nums=[];
      norm.split(/[\s,;.]+/).forEach(tk=>{const n=wordsToNumber(tk);if(n!==null)nums.push(n);});

      if(!paquetes){
        if(nums.length===1) sueltas=nums[0];
        else if(nums.length===2){paquetes=nums[0];ppp=nums[1];}
        else if(nums.length>=3){paquetes=nums[0];ppp=nums[1];sueltas=nums[2];}
      } else if(nums.length>=1){
        // ya tenemos paquetes por cajas, buscamos ppp y sueltas
        const pppMatch=norm.match(/(\d+|\w+)\s*piezas?\s*(?:por\s*)?(?:paquete|bolsa)/);
        if(pppMatch) ppp=wordsToNumber(pppMatch[1])||0;
        else if(nums.length>=2) ppp=nums[1];
        const sueltaMatch=norm.match(/(\d+|\w+)\s*piezas?\s*sueltas?/);
        if(sueltaMatch) sueltas=wordsToNumber(sueltaMatch[1])||0;
      }

      const total=paquetes*ppp+sueltas;
      return {ok:total>0||paquetes>0,paquetes,ppp,sueltas,cajas,paqPorCaja,total,raw:text};
    }

    function parseDistribucion(text,totalPiezas=0){
      const norm=text.toLowerCase().replace(/[áéíóú]/g,c=>({á:"a",é:"e",í:"i",ó:"o",ú:"u"}[c])).replace(/\by\b/g," ");
      const res={M:{paquetes:0,piezas:0},C:{paquetes:0,piezas:0},R:{paquetes:0,piezas:0}};
      let found=false;

      if(/todo\s+(?:para|a)\s+(\w+)/.test(norm)){
        const u=ALIAS[RegExp.$1]||RegExp.$1.toUpperCase();
        if(UBICACIONES.includes(u)){res[u].piezas=totalPiezas;return {ok:true,distribucion:res};}
      }
      if(/cada\s+(uno|quien|lugar)/.test(norm)){
        const n=wordsToNumber(norm.match(/(\d+|\w+)\s*(?:a\s+)?cada/)?.[1])||1;
        UBICACIONES.forEach(u=>res[u].paquetes=n);
        return {ok:true,distribucion:res};
      }
      for(const [alias,ubic] of Object.entries(ALIAS)){
        const re=new RegExp(`(\\d+|\\w+)\\s*(?:paquetes?|piezas?)?\\s*(?:para|a|en)?\\s*${alias}`,"i");
        const m=norm.match(re);
        if(m){const n=wordsToNumber(m[1])??parseInt(m[1])??0; if(norm.includes("pieza")) res[ubic].piezas+=n; else res[ubic].paquetes+=n; found=true;}
      }
      const corto=norm.match(/(\d+)\s*m\s*(\d+)\s*c\s*(\d+)\s*r/i)||norm.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
      if(corto){res.M.paquetes=+corto[1]||0;res.C.paquetes=+corto[2]||0;res.R.paquetes=+corto[3]||0;found=true;}
      return found?{ok:true,distribucion:res}:{ok:false};
    }

    // ===================== IMAGEN =====================
    async function procesarImagen(file){
      return new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=e=>{
          const img=new Image();
          img.onload=()=>{
            const c=document.createElement("canvas");
            c.width=96;c.height=96;
            const ctx=c.getContext("2d");
            const r=Math.max(96/img.width,96/img.height);
            ctx.drawImage(img,(96-img.width*r)/2,(96-img.height*r)/2,img.width*r,img.height*r);
            c.toBlob(b=>resolve(b),"image/webp",0.7);
          };
          img.src=e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }
    async function subirImagen(blob){
      if(!supabase||!state.online) return null;
      const path=`productos/${uid()}.webp`;
      const {error}=await supabase.storage.from(STORAGE_BUCKET).upload(path,blob,{contentType:"image/webp"});
      if(error) throw error;
      return supabase.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
    }

    // ===================== AUTH + CONFIG =====================
    async function login(codigo,pin){
      codigo=codigo.trim().toUpperCase();
      if(supabase&&state.online){
        const {data}=await supabase.from("usuarios").select("*").eq("id",codigo).eq("pin",pin).maybeSingle();
        if(data){await db.usuarios.put({...data,synced:true});return data;}
      }
      const local=await db.usuarios.get(codigo);
      return (local&&local.pin===pin)?local:null;
    }
    async function seed(){
      if(await db.usuarios.count()===0){
        await db.usuarios.bulkPut([
          {id:"ADMIN",pin:"1234",rol:"admin",synced:false},
          {id:"M1",pin:"1111",rol:"sucursal",synced:false},
          {id:"C1",pin:"4444",rol:"sucursal",synced:false},
          {id:"R1",pin:"6666",rol:"sucursal",synced:false}
        ]);
      }
    }
    async function getConfig(key,def=""){
      const r=await db.config.get(key);
      return r?r.value:def;
    }
    async function setConfig(key,value){
      await db.config.put({key,value});
    }

    // ===================== BÚSQUEDA COINCIDENCIAS =====================
    async function buscarCoincidencias(texto){
      if(!texto||texto.length<2) return [];
      const t=texto.toLowerCase().trim();
      const prods=await db.productos.toArray();
      const results=[];
      for(const p of prods){
        const nombre=(p.nombre||"").toLowerCase();
        const codigo=(p.codigo||"").toLowerCase();
        let score=0;
        if(codigo===t) score=100;
        else if(nombre===t) score=90;
        else if(nombre.includes(t)||t.includes(nombre)) score=70;
        else {
          // sinónimos
          for(const [k,vals] of Object.entries(SINONIMOS)){
            if((nombre.includes(k)||vals.some(v=>nombre.includes(v))) && (t.includes(k)||vals.some(v=>t.includes(v)))) score=60;
          }
        }
        if(score>0) results.push({...p,score});
      }
      return results.sort((a,b)=>b.score-a.score).slice(0,5);
    }

    // ===================== RENDER =====================
    function render(){
      const app=$("#app");

      if(state.view==="login"){app.appendChild(renderLogin());return;}
      app.appendChild(renderHeader());

        else main.appendChild(renderConfig());

        if(state.view==="consultar") main.appendChild(renderConsultar());
        else main.appendChild(renderRecibir());

      app.appendChild(renderNav());

    // ===================== REGISTRO (compacto) =====================

        <!-- Cantidades -->
        <div class="grid grid-cols-[1fr_1fr_1fr_auto] gap-1.5 items-end">

          <div><label class="text-[10px] text-slate-500">Pz/Paq</label><input id="p-ppp" type="number" value="0" class="w-full px-1.5 py-1.5 rounded-lg border text-center text-sm" /></div>

        </div>
        <div class="grid grid-cols-3 gap-1.5 text-center">
          <div class="bg-brand-50 rounded-lg p-1.5">
            <div class="font-bold text-brand-700 text-sm">M</div>

              <input id="d-M-paq" type="number" value="0" class="w-10 px-1 py-1 rounded border text-center text-xs" placeholder="PQ" />

            <div class="font-bold text-brand-700 text-sm">R</div>
            <div class="flex gap-1 justify-center mt-1">
              <input id="d-R-paq" type="number" value="0" class="w-10 px-1 py-1 rounded border text-center text-xs" placeholder="PQ" />

      setTimeout(async()=>{

        const lastProv=await getConfig("last_proveedor","");

        const calc=()=>{
          const paq=+$("#p-paquetes").value||0;
          const ppp=+$("#p-ppp").value||0;
          const sue=+$("#p-sueltas").value||0;
          const total=paq*ppp+sue;

          else if(distTotal===total&&total>0){val.textContent="Distribución completa";val.className="text-xs font-medium text-emerald-600";}
          else{val.textContent="Falta distribuir";val.className="text-xs font-medium text-amber-600";}
          return {total,dist,ppp,paq,sue};
        };
        ["#p-paquetes","#p-ppp","#p-sueltas","#d-M-paq","#d-M-pzs","#d-C-paq","#d-C-pzs","#d-R-paq","#d-R-pzs"].forEach(s=>$(s)?.addEventListener("input",calc));

        // Coincidencias al escribir nombre o código
        const mostrarCoincidencias=async(texto)=>{
          const box=$("#coincidencias");
          if(!texto||texto.length<2){box.classList.add("hidden");return;}
          const coins=await buscarCoincidencias(texto);
          if(!coins.length){box.classList.add("hidden");return;}
          box.classList.remove("hidden");
          box.innerHTML=coins.map(c=>`
            <button data-id="${c.id}" class="block w-full text-left py-1 border-b border-amber-100 last:border-0 coincidencia">
              <span class="font-semibold">${escapeHtml(c.nombre)}</span> <span class="text-slate-500">(${escapeHtml(c.codigo)})</span>
            </button>
          `).join("");
          box.querySelectorAll(".coincidencia").forEach(btn=>{
            btn.onclick=async()=>{
              const p=await db.productos.get(btn.dataset.id);
              if(p){
                productoSeleccionado=p;
                $("#p-codigo").value=p.codigo||"";
                $("#p-nombre").value=p.nombre||"";
                box.classList.add("hidden");
                toast("Producto existente seleccionado");
              }
            };
          });
        };
        $("#p-nombre").addEventListener("input",e=>mostrarCoincidencias(e.target.value));
        $("#p-codigo").addEventListener("input",e=>mostrarCoincidencias(e.target.value));

        // Foto
        $("#foto-input").onchange=async e=>{
          const f=e.target.files[0]; if(!f) return;
          fotoBlob=await procesarImagen(f);
          $("#foto-preview").innerHTML=`<img src="${URL.createObjectURL(fotoBlob)}" class="w-14 h-14 rounded-lg object-cover">`;
        };

        // Dictados
        const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
        const dictar=(btnId,statusCb,handler)=>{
          $(btnId).onclick=()=>{
            if(!SR){toast("Sin soporte de voz","err");return;}
            const r=new SR(); r.lang="es-MX";
            statusCb(true);
            r.onresult=e=>{statusCb(false);handler(e.results[0][0].transcript);};
            r.onerror=()=>statusCb(false);
            r.start();
          };
        };
        dictar("#btn-dictar-nombre",()=>{},texto=>{
          $("#p-nombre").value=texto;
          mostrarCoincidencias(texto);
          toast("Nombre: "+texto);
        });
        dictar("#btn-dictar-cant",()=>{},texto=>{
          const res=parseCantidades(texto);
          if(res.ok){
            $("#p-paquetes").value=res.paquetes;
            $("#p-ppp").value=res.ppp;
            $("#p-sueltas").value=res.sueltas;
            calc();
            toast(`Cantidades: ${res.total} pz`);
          } else toast("No entendí cantidades","warn");
        });
        dictar("#btn-dictar-dist",()=>{},texto=>{
          const {total}=calc();
          const res=parseDistribucion(texto,total);
          if(res.ok){
            UBICACIONES.forEach(u=>{
              $(`#d-${u}-paq`).value=res.distribucion[u].paquetes;
              $(`#d-${u}-pzs`).value=res.distribucion[u].piezas;
            });
            calc();
            toast("Distribución aplicada");
          } else toast("No entendí distribución","warn");
        });

        // Guardar
        $("#btn-guardar").onclick=async()=>{
          const nombre=$("#p-nombre").value.trim();
          if(!nombre){toast("Nombre obligatorio","err");return;}
          const {total,dist,ppp,paq,sue}=calc();
          if(total<=0){toast("Indica cantidades","err");return;}

          const codigo=$("#p-codigo").value.trim().toUpperCase()||("P"+Date.now().toString().slice(-6));
          const proveedor=$("#p-proveedor").value.trim();
          const nota=hoyNota();

          // Guardar último proveedor
          if(proveedor) await setConfig("last_proveedor",proveedor);

          let prod=productoSeleccionado;
          if(!prod){
            // buscar otra vez
            const coins=await buscarCoincidencias(nombre);
            if(coins.length&&coins[0].score>=90) prod=coins[0];
          }
          if(!prod){
            prod={
              id:uid(),
              codigo,
              nombre,
              estado:"activo",
              stock_total_bodega:total,
              piezas_por_paquete:ppp,
              precio_base:+$("#p-precio").value||null,
              creado_en:new Date().toISOString(),
              synced:false
            };
          } else {
            prod.stock_total_bodega=(prod.stock_total_bodega||0)+total;
            prod.synced=false;
            if(codigo&&codigo!==prod.codigo){
              prod.sinonimos=prod.sinonimos||[];
              if(!prod.sinonimos.includes(codigo)) prod.sinonimos.push(codigo);
            }
          }
          await db.productos.put(prod);

          let fUrl=null;
          if(fotoBlob){try{fUrl=await subirImagen(fotoBlob);}catch(e){}}

          // Siempre crear COMPRA (aparece en reporte)
          const compra={
            id:uid(),
            producto_id:prod.id,
            codigo:prod.codigo,
            nombre:prod.nombre,
            fecha:new Date().toISOString().slice(0,10),
            proveedor,
            nota,
            foto_url:fUrl,
            paquetes:paq,
            piezas_por_paquete:ppp,
            piezas_sueltas:sue,
            total_piezas:total,
            desglose: formatearDesglose(paq,ppp,sue),
            creado_en:new Date().toISOString(),
            creado_por:state.user.id,
            synced:false
          };
          await db.compras.put(compra);

          // Distribución
          for(const u of UBICACIONES){
            const pz=dist[u].paquetes*ppp+dist[u].piezas;
            if(pz>0){
              await db.envios.put({
                id:uid(),
                producto_id:prod.id,
                nombre:prod.nombre,
                sucursal_destino:u,
                total_enviado_piezas:pz,
                paquetes_enviados:dist[u].paquetes,
                piezas_sueltas_enviadas:dist[u].piezas,
                estado:"ENVIADO",
                fecha_envio:new Date().toISOString(),
                synced:false
              });
            }
          }

          toast("Producto guardado");
          // limpiar (mantener proveedor)
          $("#p-codigo").value="";
          $("#p-nombre").value="";
          $("#p-paquetes").value=0;
          $("#p-ppp").value=0;
          $("#p-sueltas").value=0;
          $("#p-precio").value="";
          UBICACIONES.forEach(u=>{$(`#d-${u}-paq`).value=0;$(`#d-${u}-pzs`).value=0;});
          $("#foto-preview").innerHTML=`<span class="text-[10px] text-slate-400 font-medium">FOTO</span>`;
          fotoBlob=null;
          productoSeleccionado=null;
          calc();
          cargarLista();
        };

        function formatearDesglose(paq,ppp,sue){
          if(paq>0&&ppp>0){
            return sue>0 ? `${paq} PQ CON ${ppp} PZ + ${sue} = ${paq*ppp+sue} PZ` : `${paq} PQ CON ${ppp} PZ = ${paq*ppp} PZ`;
          }
          return `${sue||paq*ppp} PZ`;
        }

        async function cargarLista(){
          const compras=await db.compras.orderBy("creado_en").reverse().limit(8).toArray();
          list.innerHTML=compras.length?compras.map(c=>`
            <div class="bg-white rounded-lg p-2 shadow-sm flex gap-2 items-center text-xs">
              ${c.foto_url?`<img src="${c.foto_url}" class="w-9 h-9 rounded object-cover">`:`<div class="w-9 h-9 rounded bg-slate-100 flex items-center justify-center text-[10px]">📦</div>`}
              <div class="flex-1 min-w-0">
                <p class="font-semibold truncate">${escapeHtml(c.nombre)}</p>
                <p class="text-slate-500">${c.desglose||(c.total_piezas+" pz")} · ${c.nota||""}</p>
              </div>
            </div>
          `).join(""):`<p class="text-xs text-slate-400 text-center py-2">Sin registros</p>`;
        }
        cargarLista();
        calc();
      },0);
      return wrap;
    }

    // ===================== CONSULTAR PRECIOS =====================
    function renderConsultar(){
      const wrap=el("div",{class:"space-y-2"});
      wrap.appendChild(el("h2",{class:"text-base font-bold text-brand-900"},"Consulta de precios"));
      const search=el("input",{type:"text",id:"c-search",placeholder:"🔍 Nombre o código...",class:"w-full px-3 py-2 rounded-xl border text-sm outline-none"});
      wrap.appendChild(search);
      const list=el("div",{id:"c-list",class:"space-y-1.5"});
      wrap.appendChild(list);

      setTimeout(async()=>{
        const prods=await db.productos.toArray();
        const renderList=(q="")=>{
          const filt=prods.filter(p=>!q||(p.nombre||"").toLowerCase().includes(q.toLowerCase())||(p.codigo||"").toLowerCase().includes(q.toLowerCase()));
          list.innerHTML=filt.length?filt.map(p=>`
            <div class="bg-white rounded-xl p-2.5 shadow-sm flex justify-between items-center">
              <div class="min-w-0">
                <p class="font-semibold text-sm truncate">${escapeHtml(p.nombre)}</p>
                <p class="text-[10px] text-slate-500">${escapeHtml(p.codigo)}</p>
              </div>
              <p class="font-bold text-brand-600 text-sm">${p.precio_base!=null?"$"+Number(p.precio_base).toLocaleString("es-MX"):"—"}</p>
            </div>
          `).join(""):`<p class="text-xs text-slate-400 text-center py-6">Sin resultados</p>`;
        };
        renderList();
        search.oninput=()=>renderList(search.value);
      },0);
      return wrap;
    }

    // ===================== REPORTES + PDF =====================
    function renderReportes(){
      const wrap=el("div",{class:"space-y-2"});
      wrap.appendChild(el("h2",{class:"text-base font-bold text-brand-900"},"Reportes"));

      const tabs=el("div",{class:"flex gap-1.5"});
      ["compra","traslado","diferencias"].forEach(t=>{
        tabs.appendChild(el("button",{
          class:`px-3 py-1.5 rounded-full text-xs font-medium ${state.rtab===t?"bg-brand-600 text-white":"bg-white shadow text-slate-600"}`,
          onclick:()=>{state.rtab=t;render();}
        },t.toUpperCase()));
      });
      wrap.appendChild(tabs);

      const body=el("div",{id:"rep-body",class:"mt-2 space-y-1.5"});
      wrap.appendChild(body);

      setTimeout(async()=>{
        const tab=state.rtab||"compra";
        if(tab==="compra"){
          const compras=await db.compras.orderBy("fecha").reverse().toArray();
          // Agrupar por nota
          const porNota={};
          compras.forEach(c=>{
            const k=c.nota||"SIN-NOTA";
            if(!porNota[k]) porNota[k]={nota:k,proveedor:c.proveedor,fecha:c.fecha,items:[]};
            porNota[k].items.push(c);
          });

          body.innerHTML=Object.values(porNota).map(g=>`
            <div class="bg-white rounded-xl p-3 shadow-sm">
              <div class="flex justify-between items-center mb-2">
                <div>
                  <p class="font-bold text-sm">COMPRA ${escapeHtml(g.nota)}</p>
                  <p class="text-[10px] text-slate-500">${escapeHtml(g.proveedor||"Sin proveedor")} · ${g.fecha}</p>
                </div>
                <button data-nota="${g.nota}" class="btn-pdf px-2.5 py-1 bg-brand-600 text-white rounded-lg text-[10px] font-semibold">PDF</button>
              </div>
              ${g.items.map(c=>`
                <div class="flex gap-2 items-center py-1.5 border-t border-slate-100 text-xs">
                  ${c.foto_url?`<img src="${c.foto_url}" class="w-10 h-10 rounded object-cover">`:`<div class="w-10 h-10 rounded bg-slate-100 flex items-center justify-center">📦</div>`}
                  <div class="flex-1 min-w-0">
                    <p class="font-semibold truncate">${escapeHtml(c.nombre)}</p>
                    <p class="text-slate-500">${escapeHtml(c.codigo)} · ${c.desglose||c.total_piezas+" pz"}</p>
                  </div>
                </div>
              `).join("")}
            </div>
          `).join("") || `<p class="text-xs text-slate-400 text-center py-6">No hay compras</p>`;

          body.querySelectorAll(".btn-pdf").forEach(btn=>{
            btn.onclick=()=>generarPDFCompra(btn.dataset.nota, porNota[btn.dataset.nota]);
          });
        } else {
          body.innerHTML=`<p class="text-xs text-slate-400 text-center py-6">Reporte ${tab} en construcción</p>`;
        }
      },0);
      return wrap;
    }

    function generarPDFCompra(nota, grupo){
      const w=window.open("","_blank");
      if(!w){toast("Permite ventanas emergentes","warn");return;}
      const filas=grupo.items.map(c=>`
        <tr>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;">
            ${c.foto_url?`<img src="${c.foto_url}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;">`:"📦"}
          </td>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;">
            <b>${escapeHtml(c.nombre)}</b><br>
            <span style="color:#64748b;font-size:12px;">${escapeHtml(c.codigo)}</span>
          </td>
          <td style="padding:8px;border-bottom:1px solid #e2e8f0;font-size:13px;">
            ${escapeHtml(c.desglose||(c.total_piezas+" pz"))}
          </td>
        </tr>
      `).join("");

      w.document.write(`
        <!DOCTYPE html><html><head><title>COMPRA ${nota}</title>
        <style>
          body{font-family:Arial,sans-serif;padding:24px;color:#0f172a;}
          h1{font-size:20px;margin:0 0 4px;}
          .meta{color:#64748b;font-size:13px;margin-bottom:20px;}
          table{width:100%;border-collapse:collapse;}
          th{text-align:left;padding:8px;border-bottom:2px solid #0f172a;font-size:12px;}
        </style></head><body>
          <h1>COMPRA ${escapeHtml(nota)}</h1>
          <div class="meta">Proveedor: <b>${escapeHtml(grupo.proveedor||"—")}</b> &nbsp;·&nbsp; Fecha: ${grupo.fecha}</div>
          <table>
            <thead><tr><th>Foto</th><th>Producto</th><th>Cantidad</th></tr></thead>
            <tbody>${filas}</tbody>
          </table>
          <script>setTimeout(()=>window.print(),400);<\/script>
        </body></html>
      `);
      w.document.close();
    }

    function renderConfig(){
      return el("div",{class:"p-2"},el("p",{class:"text-sm text-slate-500"},"Configuración de usuarios y notas pendientes."));
    }
    function renderRecibir(){
      return el("div",{class:"p-2"},el("p",{class:"text-sm text-slate-500"},"Recepción con una sola firma (próxima iteración)."));
    }

    // ===================== INIT =====================
    async function init(){
      await seed();
      window.addEventListener("online",()=>{state.online=true;});
      window.addEventListener("offline",()=>{state.online=false;});
      render();
    }
    init();
  </script>
</body>
</html>
